<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Mesa de Atendimento V2</title>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f2f2f2;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 20px;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    .cpaig {
      margin-top: 6px;
      color: #f2c94c;
      font-weight: bold;
      font-size: 18px;
    }

    .subtitulo {
      margin-top: 8px;
      font-size: 16px;
    }

    main {
      max-width: 1000px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.10);
    }

    .status {
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .online {
      background: #d9f5df;
      color: #176b2e;
    }

    .offline {
      background: #ffe0e0;
      color: #9b1c1c;
    }

    .botoes {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn {
      background: #333;
      color: white;
    }

    .btn-print {
      background: #1769aa;
      color: white;
    }

    .btn-receber {
      background: #16803c;
      color: white;
    }

    .controles {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .controles label {
      font-weight: bold;
    }

    .controles select {
      padding: 10px;
      border: 1px solid #bbb;
      border-radius: 8px;
      font-size: 15px;
    }

    .item {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 12px;
      background: #fafafa;
    }

    .item.pendente {
      border-left: 6px solid #e2a400;
    }

    .item.confirmado {
      border-left: 6px solid #16803c;
    }

    .item-topo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .nome {
      font-size: 20px;
      font-weight: bold;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
    }

    .badge-pendente {
      background: #ffe4a3;
      color: #765300;
    }

    .badge-confirmado {
      background: #ccefd4;
      color: #176b2e;
    }

    .dados {
      line-height: 1.7;
    }

    .vazio {
      text-align: center;
      color: #777;
      padding: 25px;
    }

    .modal-fundo {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.55);
      overflow-y: auto;
      padding: 20px;
    }

    .modal {
      background: white;
      max-width: 650px;
      margin: 30px auto;
      border-radius: 12px;
      padding: 20px;
    }

    .modal h2 {
      margin-top: 0;
    }

    .opcao-impressao {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .opcao-impressao label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .opcao-impressao select,
    .opcao-impressao input[type="date"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #bbb;
      border-radius: 8px;
      font-size: 15px;
    }

    .modal-botoes {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .btn-cancelar {
      background: #777;
      color: white;
    }

    #listaImpressao {
      display: none;
    }


    @media print {

      body * {
        visibility: hidden !important;
      }

      #listaImpressao,
      #listaImpressao * {
        visibility: visible !important;
      }

      #listaImpressao {
        display: block !important;
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        padding: 8mm;
      }

      .print-cabecalho {
        text-align: center;
        margin-bottom: 10px;
      }

      .print-cabecalho h1 {
        font-size: 16px;
        margin: 0 0 4px 0;
      }

      .print-data {
        font-size: 12px;
        margin-bottom: 8px;
      }

      .print-grupo {
        margin-bottom: 10px;
      }

      .print-grupo.pagina {
        page-break-after: always;
      }

      .print-grupo h2 {
        font-size: 13px;
        margin: 5px 0;
        padding-bottom: 3px;
        border-bottom: 1px solid #000;
      }

      .print-tabela {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }

      .print-tabela th,
      .print-tabela td {
        border: 1px solid #000;
        padding: 2px 3px;
        font-size: 9px;
        line-height: 1.15;
      }

      .print-tabela th {
        font-weight: bold;
      }

      .col-nome {
        width: 34%;
      }

      .col-rgi {
        width: 16%;
      }

      .col-pavilhao {
        width: 9%;
        text-align: center;
      }

      .col-cela {
        width: 7%;
        text-align: center;
      }

      .col-atendimento {
        width: 20%;
      }

      .col-data {
        width: 14%;
        text-align: center;
      }

      .print-tabela th.col-pavilhao,
      .print-tabela td.col-pavilhao,
      .print-tabela th.col-cela,
      .print-tabela td.col-cela {
        text-align: center;
        padding-left: 1px;
        padding-right: 1px;
      }

      @page {
        size: A4;
        margin: 8mm;
      }

    }

  </style>

</head>


<body>

<header>

  <h1>
    POLÍCIA PENAL DE MATO GROSSO DO SUL
  </h1>

  <div class="cpaig">
    CPAIG
  </div>

  <div class="subtitulo">
    Mesa de Recebimento — Sistema de Atendimento V2
  </div>

</header>


<main>

  <div
    id="status"
    class="status offline"
  >
    ● Desconectado
  </div>


  <section class="card">

    <div class="botoes">

      <button
        class="btn"
        onclick="ativarNotificacoes()"
      >
        🔔 NOTIFICAÇÕES
      </button>

      <button
        class="btn"
        onclick="alternarSom()"
        id="btnSom"
      >
        🔊 SOM: ON
      </button>

      <button
        class="btn-print"
        onclick="abrirImpressao()"
      >
        🖨️ IMPRIMIR LISTA
      </button>

    </div>

  </section>


  <section class="card">

    <h2>
      Histórico de atendimentos recebidos
    </h2>

    <div class="controles">

      <label for="ordemMesa">
        Visualizar:
      </label>

      <select
        id="ordemMesa"
        onchange="render()"
      >

        <option value="envio">
          Ordem de envio
        </option>

        <option value="atendimento">
          Por atendimento
        </option>

      </select>

    </div>


    <div id="fila"></div>

  </section>


  <div id="listaImpressao"></div>

</main>


<!-- PAINEL DE IMPRESSÃO -->

<div
  id="modalImpressao"
  class="modal-fundo"
>

  <div class="modal">

    <h2>
      Opções de impressão
    </h2>


    <div class="opcao-impressao">

      <label for="tipoImpressao">
        Tipo de impressão
      </label>

      <select
        id="tipoImpressao"
        onchange="atualizarOpcoesImpressao()"
      >

        <option value="atendimento">
          Por atendimento
        </option>

        <option value="geral">
          Por atendimento geral
        </option>

        <option value="data">
          Por data
        </option>

      </select>

    </div>


    <div
      id="opcaoAtendimento"
      class="opcao-impressao"
    >

      <label for="filtroAtendimento">
        Escolha o atendimento
      </label>

      <select id="filtroAtendimento">

        <option value="">
          Selecione
        </option>

      </select>

    </div>


    <div
      id="opcaoData"
      class="opcao-impressao"
      style="display:none;"
    >

      <label for="filtroData">
        Escolha a data
      </label>

      <input
        type="date"
        id="filtroData"
      >

    </div>


    <div
      id="opcaoPagina"
      class="opcao-impressao"
    >

      <label>

        <input
          type="checkbox"
          id="umPorPagina"
        >

        Um atendimento por página

      </label>

    </div>


    <div class="modal-botoes">

      <button
        class="btn-print"
        onclick="executarImpressao()"
      >
        🖨️ IMPRIMIR
      </button>


      <button
        class="btn-cancelar"
        onclick="fecharImpressao()"
      >
        CANCELAR
      </button>

    </div>

  </div>

</div>


<script>

  const WS_URL =
    (location.protocol === "https:" ? "wss://" : "ws://") +
    location.host;


  let ws = null;

  let somAtivo = true;


  let lista =
    JSON.parse(
      localStorage.getItem(
        "mesaAtendimentosV2"
      ) || "[]"
    );


  const filaEl =
    document.getElementById(
      "fila"
    );

  const statusEl =
    document.getElementById(
      "status"
    );


  function salvar() {

    localStorage.setItem(
      "mesaAtendimentosV2",
      JSON.stringify(
        lista
      )
    );
  }


  function dataHoje() {

    const agora =
      new Date();

    const ano =
      agora.getFullYear();

    const mes =
      String(
        agora.getMonth() + 1
      ).padStart(2, "0");

    const dia =
      String(
        agora.getDate()
      ).padStart(2, "0");

    return `${ano}-${mes}-${dia}`;
  }


  function formatarData(
    data
  ) {

    if (!data) {
      return "-";
    }

    const partes =
      String(data).split("-");


    if (
      partes.length === 3
    ) {

      return (
        partes[2] +
        "/" +
        partes[1] +
        "/" +
        partes[0]
      );
    }


    return new Date(
      data
    ).toLocaleString(
      "pt-BR"
    );
  }


  function atualizarStatus(
    online
  ) {

    if (online) {

      statusEl.textContent =
        "● Conectado";

      statusEl.className =
        "status online";

    } else {

      statusEl.textContent =
        "● Desconectado — aguardando reconexão";

      statusEl.className =
        "status offline";
    }
  }


  function conectar() {

    try {

      ws =
        new WebSocket(
          WS_URL
        );


      ws.onopen = () => {

        atualizarStatus(
          true
        );

        ws.send(
          JSON.stringify({
            type: "register",
            role: "receiver"
          })
        );
      };


      ws.onmessage = (
        event
      ) => {

        let mensagem;

        try {

          mensagem =
            JSON.parse(
              event.data
            );

        } catch {

          return;
        }


        if (
          mensagem.type ===
          "new_record"
        ) {

          receberAtendimento(
            mensagem
          );

          return;
        }


        if (
          mensagem.type ===
          "record_received"
        ) {

          confirmarLocal(
            mensagem.recordId,
            mensagem.receivedAt
          );
        }

      };


      ws.onclose = () => {

        atualizarStatus(
          false
        );

        setTimeout(
          conectar,
          3000
        );
      };


      ws.onerror = () => {

        atualizarStatus(
          false
        );
      };


    } catch {

      atualizarStatus(
        false
      );

      setTimeout(
        conectar,
        3000
      );
    }
  }


  function receberAtendimento(
    mensagem
  ) {

    const existente =
      lista.find(
        item =>
          item.recordId ===
          mensagem.recordId
      );


    if (existente) {

      render();

      return;
    }


    const item = {

      recordId:
        mensagem.recordId,

      ...(
        mensagem.record ||
        {}
      ),

      enviadoEm:
        mensagem.sentAt ||
        new Date().toISOString(),

      recebidoEm:
        null

    };


    lista.unshift(
      item
    );


    salvar();

    render();


    if (
      somAtivo
    ) {
      tocarSom();
    }


    mostrarNotificacao(
      item
    );
  }


  function receberConfirmacao(
    recordId
  ) {

    if (
      !ws ||
      ws.readyState !==
        WebSocket.OPEN
    ) {
      return;
    }


    ws.send(
      JSON.stringify({
        type:
          "confirm_received",

        recordId
      })
    );
  }


  function marcarRecebido(
    recordId
  ) {

    const item =
      lista.find(
        x =>
          x.recordId ===
          recordId
      );


    if (!item) {
      return;
    }


    if (
      item.recebidoEm
    ) {
      return;
    }


    const agora =
      new Date().toISOString();


    item.recebidoEm =
      agora;


    salvar();

    render();


    receberConfirmacao(
      recordId
    );
  }


  function confirmarLocal(
    recordId,
    receivedAt
  ) {

    const item =
      lista.find(
        x =>
          x.recordId ===
          recordId
      );


    if (!item) {
      return;
    }


    item.recebidoEm =
      item.recebidoEm ||
      receivedAt;


    salvar();

    render();
  }


  function render() {

    if (!lista.length) {

      filaEl.innerHTML =
        '<div class="vazio">Nenhum atendimento recebido.</div>';

      return;
    }


    const ordem =
      document.getElementById(
        "ordemMesa"
      ).value;


    const ordenada =
      lista
        .slice()
        .sort(
          (a,b) => {

            if (
              ordem ===
              "atendimento"
            ) {

              const cmp =
                String(
                  a.atendimento ||
                  ""
                ).localeCompare(
                  String(
                    b.atendimento ||
                    ""
                  ),
                  "pt-BR"
                );


              if (
                cmp !== 0
              ) {
                return cmp;
              }
            }


            return (
              new Date(
                b.enviadoEm ||
                0
              ) -
              new Date(
                a.enviadoEm ||
                0
              )
            );
          }
        );


    filaEl.innerHTML =
      ordenada
        .map(
          item => {

            const confirmado =
              !!item.recebidoEm;


            return `

              <div
                class="item ${
                  confirmado
                    ? "confirmado"
                    : "pendente"
                }"
              >

                <div
                  class="item-topo"
                >

                  <div
                    class="nome"
                  >
                    ${escapeHtml(
                      item.nome
                    )}
                  </div>

                  <span
                    class="badge ${
                      confirmado
                        ? "badge-confirmado"
                        : "badge-pendente"
                    }"
                  >
                    ${
                      confirmado
                        ? "RECEBIDO"
                        : "AGUARDANDO RECEBIMENTO"
                    }
                  </span>

                </div>


                <div class="dados">

                  <div>
                    <strong>RGI:</strong>
                    ${escapeHtml(
                      item.rgi ||
                      ""
                    )}
                  </div>

                  <div>
                    <strong>Pavilhão:</strong>
                    ${escapeHtml(
                      item.pavilhao ||
                      ""
                    )}
                  </div>

                  <div>
                    <strong>Cela:</strong>
                    ${escapeHtml(
                      item.cela ||
                      ""
                    )}
                  </div>

                  <div>
                    <strong>Atendimento:</strong>
                    ${escapeHtml(
                      item.atendimento ||
                      ""
                    )}
                  </div>

                  <div>
                    <strong>Data do atendimento:</strong>
                    ${formatarData(
                      item.dataAtendimento
                    )}
                  </div>

                  ${
                    item.assunto
                      ? `
                        <div>
                          <strong>Assunto:</strong>
                          ${escapeHtml(
                            item.assunto
                          )}
                        </div>
                      `
                      : ""
                  }

                  <div>
                    <strong>Enviado em:</strong>
                    ${new Date(
                      item.enviadoEm
                    ).toLocaleString(
                      "pt-BR"
                    )}
                  </div>

                  ${
                    item.recebidoEm
                      ? `
                        <div>
                          <strong>Recebido em:</strong>
                          ${new Date(
                            item.recebidoEm
                          ).toLocaleString(
                            "pt-BR"
                          )}
                        </div>
                      `
                      : ""
                  }

                </div>


                ${
                  !confirmado
                    ? `
                      <div
                        style="margin-top:15px;"
                      >

                        <button
                          class="btn-receber"
                          onclick="marcarRecebido('${item.recordId}')"
                        >
                          ✓ RECEBIDO
                        </button>

                      </div>
                    `
                    : ""
                }

              </div>

            `;
          }
        )
        .join("");
  }


  function escapeHtml(
    valor
  ) {

    return String(
      valor ?? ""
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );
  }


  function alternarSom() {

    somAtivo =
      !somAtivo;


    document.getElementById(
      "btnSom"
    ).textContent =
      somAtivo
        ? "🔊 SOM: ON"
        : "🔇 SOM: OFF";
  }


  function tocarSom() {

    try {

      const audio =
        new Audio();

      audio.src =
        "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=";

      audio.play()
        .catch(() => {});

    } catch {}
  }


  async function ativarNotificacoes() {

    if (
      !("Notification" in window)
    ) {

      alert(
        "Este navegador não oferece notificações."
      );

      return;
    }


    const permissao =
      await Notification.requestPermission();


    if (
      permissao ===
      "granted"
    ) {

      alert(
        "Notificações ativadas."
      );

    } else {

      alert(
        "As notificações não foram autorizadas."
      );
    }
  }


  function mostrarNotificacao(
    item
  ) {

    if (
      !("Notification" in window)
    ) {
      return;
    }


    if (
      Notification.permission !==
      "granted"
    ) {
      return;
    }


    try {

      new Notification(
        "Novo atendimento",
        {
          body:
            item.nome +
            " — " +
            item.atendimento
        }
      );

    } catch {}
  }


  /*
   * IMPRESSÃO
   */

  function abrirImpressao() {

    preencherFiltroAtendimento();

    document.getElementById(
      "filtroData"
    ).value =
      dataHoje();


    document.getElementById(
      "modalImpressao"
    ).style.display =
      "block";


    atualizarOpcoesImpressao();
  }


  function fecharImpressao() {

    document.getElementById(
      "modalImpressao"
    ).style.display =
      "none";
  }


  function preencherFiltroAtendimento() {

    const select =
      document.getElementById(
        "filtroAtendimento"
      );


    const atual =
      select.value;


    const atendimentos =
      [
        ...new Set(
          lista
            .map(
              x =>
                x.atendimento
            )
            .filter(Boolean)
        )
      ]
      .sort(
        (a,b) =>
          a.localeCompare(
            b,
            "pt-BR"
          )
      );


    select.innerHTML =
      '<option value="">Selecione</option>';


    atendimentos.forEach(
      atendimento => {

        const option =
          document.createElement(
            "option"
          );

        option.value =
          atendimento;

        option.textContent =
          atendimento;

        select.appendChild(
          option
        );
      }
    );


    if (
      atendimentos.includes(
        atual
      )
    ) {

      select.value =
        atual;
    }
  }


  function atualizarOpcoesImpressao() {

    const tipo =
      document.getElementById(
        "tipoImpressao"
      ).value;


    document.getElementById(
      "opcaoAtendimento"
    ).style.display =
      tipo === "atendimento"
        ? "block"
        : "none";


    document.getElementById(
      "opcaoData"
    ).style.display =
      tipo === "data"
        ? "block"
        : "none";


    document.getElementById(
      "opcaoPagina"
    ).style.display =
      tipo === "atendimento"
        ? "block"
        : "none";
  }


  function executarImpressao() {

    const tipo =
      document.getElementById(
        "tipoImpressao"
      ).value;


    let registros = [];


    if (
      tipo === "atendimento"
    ) {

      const atendimento =
        document.getElementById(
          "filtroAtendimento"
        ).value;


      if (!atendimento) {

        alert(
          "Escolha o atendimento que deseja imprimir."
        );

        return;
      }


      registros =
        lista.filter(
          x =>
            x.atendimento ===
            atendimento
        );
    }


    if (
      tipo === "geral"
    ) {

      registros =
        lista.slice();
    }


    if (
      tipo === "data"
    ) {

      const data =
        document.getElementById(
          "filtroData"
        ).value;


      if (!data) {

        alert(
          "Escolha a data que deseja imprimir."
        );

        return;
      }


      registros =
        lista.filter(
          x =>
            x.dataAtendimento ===
            data
        );
    }


    if (!registros.length) {

      alert(
        "Não existem atendimentos para os filtros escolhidos."
      );

      return;
    }


    const umPorPagina =
      document.getElementById(
        "umPorPagina"
      ).checked;


    gerarListaImpressao(
      registros,
      tipo,
      umPorPagina
    );


    fecharImpressao();


    setTimeout(
      () => {
        window.print();
      },
      150
    );
  }


  function gerarListaImpressao(
    registros,
    tipo,
    umPorPagina
  ) {

    const area =
      document.getElementById(
        "listaImpressao"
      );


    let tituloData = "";


    if (
      tipo === "data"
    ) {

      const data =
        document.getElementById(
          "filtroData"
        ).value;


      tituloData =
        "Data: " +
        formatarData(
          data
        );

    } else {

      const datas =
        [
          ...new Set(
            registros
              .map(
                x =>
                  x.dataAtendimento
              )
              .filter(Boolean)
          )
        ];


      tituloData =
        datas.length === 1
          ? "Data: " +
            formatarData(
              datas[0]
            )
          : "Data: múltiplos dias";
    }


    let html = `

      <div class="print-cabecalho">

        <h1>
          CPAIG - LISTA DE ATENDIMENTOS
        </h1>

        <div class="print-data">
          ${tituloData}
        </div>

      </div>

    `;


    if (
      tipo === "geral"
    ) {

      const grupos = {};


      registros.forEach(
        item => {

          const chave =
            item.atendimento ||
            "Sem atendimento";


          if (
            !grupos[chave]
          ) {
            grupos[chave] = [];
          }


          grupos[chave].push(
            item
          );
        }
      );


      Object.keys(
        grupos
      )
      .sort(
        (a,b) =>
          a.localeCompare(
            b,
            "pt-BR"
          )
      )
      .forEach(
        atendimento => {

          html +=
            montarTabela(
              grupos[
                atendimento
              ],
              atendimento,
              false
            );
        }
      );

    } else {

      html +=
        montarTabela(
          registros,
          tipo === "atendimento"
            ? registros[0]
                .atendimento
            : "Atendimentos",
          umPorPagina
        );
    }


    area.innerHTML =
      html;
  }


  function montarTabela(
    registros,
    titulo,
    pagina
  ) {

    return `

      <div
        class="print-grupo ${
          pagina
            ? "pagina"
            : ""
        }"
      >

        <h2>
          ${escapeHtml(
            titulo
          )}
        </h2>

        <table
          class="print-tabela"
        >

          <thead>

            <tr>

              <th class="col-nome">
                NOME
              </th>

              <th class="col-rgi">
                RGI
              </th>

              <th class="col-pavilhao">
                PAVILHÃO
              </th>

              <th class="col-cela">
                CELA
              </th>

              <th class="col-atendimento">
                ATENDIMENTO
              </th>

              <th class="col-data">
                DATA
              </th>

            </tr>

          </thead>

          <tbody>

            ${registros
              .slice()
              .sort(
                (a,b) =>
                  String(
                    a.nome ||
                    ""
                  ).localeCompare(
                    String(
                      b.nome ||
                      ""
                    ),
                    "pt-BR"
                  )
              )
              .map(
                item => `

                  <tr>

                    <td class="col-nome">
                      ${escapeHtml(
                        item.nome
                      )}
                    </td>

                    <td class="col-rgi">
                      ${escapeHtml(
                        item.rgi ||
                        ""
                      )}
                    </td>

                    <td class="col-pavilhao">
                      ${escapeHtml(
                        item.pavilhao ||
                        ""
                      )}
                    </td>

                    <td class="col-cela">
                      ${escapeHtml(
                        item.cela ||
                        ""
                      )}
                    </td>

                    <td class="col-atendimento">
                      ${escapeHtml(
                        item.atendimento ||
                        ""
                      )}
                    </td>

                    <td class="col-data">
                      ${formatarData(
                        item.dataAtendimento
                      )}
                    </td>

                  </tr>

                `
              )
              .join("")}

          </tbody>

        </table>

      </div>

    `;
  }


  render();

  conectar();

</script>

</body>
</html>
