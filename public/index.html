<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guichê — Sistema de Atendimento V2.3</title>

<style>
:root{
  --blue:#123b6d;
  --blue2:#0c2d52;
  --yellow:#ffd400;
  --bg:#eef2f7;
  --green:#1d7a46;
  --red:#b42318;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:#17202a;
}

header{
  background:linear-gradient(135deg,var(--blue2),var(--blue));
  color:#fff;
  padding:18px 20px;
  text-align:center;
  box-shadow:0 2px 8px #0002;
}

header h1{
  font-size:22px;
  margin:0 0 5px;
}

header .cpaig{
  color:var(--yellow);
  font-size:18px;
  font-weight:800;
}

header h2{
  font-size:16px;
  margin:5px 0 0;
  font-weight:500;
}

.container{
  max-width:1100px;
  margin:20px auto;
  padding:0 14px;
}

.card{
  background:#fff;
  border-radius:12px;
  padding:18px;
  box-shadow:0 2px 10px #0001;
  margin-bottom:16px;
}

.grid{
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr;
  gap:12px;
}

.field label{
  display:block;
  font-weight:700;
  font-size:13px;
  margin-bottom:5px;
}

.field input,
.field select{
  width:100%;
  padding:11px;
  border:1px solid #b8c2cc;
  border-radius:8px;
  background:#fff;
  font-size:15px;
}

.name-wrap{
  position:relative;
}

.suggestions{
  position:absolute;
  z-index:20;
  left:0;
  right:0;
  top:100%;
  background:#fff;
  border:1px solid #b8c2cc;
  border-top:0;
  border-radius:0 0 8px 8px;
  max-height:250px;
  overflow:auto;
  box-shadow:0 5px 12px #0002;
}

.suggestion{
  padding:10px 12px;
  cursor:pointer;
  border-bottom:1px solid #eee;
}

.suggestion:hover,
.suggestion.active{
  background:#eaf2ff;
}

.suggestion small{
  display:block;
  color:#667085;
  margin-top:2px;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:15px;
}

.btn{
  border:0;
  border-radius:8px;
  padding:11px 15px;
  font-weight:800;
  cursor:pointer;
}

.primary{
  background:var(--blue);
  color:#fff;
}

.success{
  background:var(--green);
  color:#fff;
}

.secondary{
  background:#e5e7eb;
  color:#111827;
}

.warning{
  background:#f59e0b;
  color:#111;
}

.danger{
  background:#b42318;
  color:#fff;
}

.status{
  padding:10px;
  border-radius:8px;
  background:#f4f6f8;
  margin-top:12px;
  font-size:13px;
}

.toolbar{
  display:flex;
  gap:10px;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
}

.toolbar select{
  padding:8px;
  border-radius:7px;
  border:1px solid #b8c2cc;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}

th,
td{
  border-bottom:1px solid #e5e7eb;
  padding:8px;
  text-align:left;
  vertical-align:top;
}

th{
  background:#f3f5f7;
}

.center{
  text-align:center;
}

.muted{
  color:#667085;
}

.badge{
  display:inline-block;
  padding:3px 7px;
  border-radius:999px;
  background:#e8f5ec;
  color:#17663a;
  font-size:11px;
  font-weight:700;
}

.badge.pending{
  background:#fff3cd;
  color:#7a5800;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  z-index:100;
  padding:18px;
  overflow:auto;
}

.modal.open{
  display:block;
}

.modal-box{
  background:#fff;
  max-width:1000px;
  margin:30px auto;
  border-radius:12px;
  padding:20px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
}

.modal h3{
  margin-top:0;
}

.modal-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.modal-grid input,
.modal-grid select{
  width:100%;
  padding:9px;
  border:1px solid #b8c2cc;
  border-radius:7px;
}

.checks{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
  max-height:250px;
  overflow:auto;
  border:1px solid #ddd;
  padding:10px;
  border-radius:8px;
}

.checks label{
  display:flex;
  gap:7px;
  align-items:center;
  font-size:14px;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:15px;
  flex-wrap:wrap;
}

.hidden{
  display:none!important;
}

.archive-list{
  max-height:340px;
  overflow:auto;
  border:1px solid #ddd;
  border-radius:8px;
  margin-top:10px;
}

.archive-list label{
  display:flex;
  gap:10px;
  padding:9px;
  border-bottom:1px solid #eee;
}

.archive-list label:last-child{
  border-bottom:0;
}

.print-area{
  display:none;
}

@media(max-width:800px){

  .grid{
    grid-template-columns:1fr 1fr;
  }

  .modal-grid{
    grid-template-columns:1fr;
  }

  .checks{
    grid-template-columns:1fr;
  }

  table{
    font-size:12px;
  }
}

@media print{

  @page{
    size:A4;
    margin:5mm;
  }

  body>*:not(#printArea){
    display:none!important;
  }

  #printArea{
    display:block!important;
    color:#000;
    font-family:Arial,sans-serif;
  }

  .print-page{
    break-after:page;
    page-break-after:always;
  }

  .print-page:last-child{
    break-after:auto;
    page-break-after:auto;
  }

  .print-title{
    text-align:center;
    font-size:15px;
    font-weight:800;
    margin:0 0 3mm;
  }

  .print-subtitle{
    text-align:center;
    font-size:10px;
    margin:0 0 3mm;
  }

  .print-table{
    width:100%;
    border-collapse:collapse;
    font-size:8.5pt;
    table-layout:fixed;
  }

  .print-table th,
  .print-table td{
    border:1px solid #000;
    padding:2.5px 3px;
    line-height:1.15;
    vertical-align:top;
  }

  .print-table th{
    font-weight:800;
  }

  .print-table .col-nome{
    width:32%;
  }

  .print-table .col-rgi{
    width:14%;
  }

  .print-table .col-pav{
    width:9%;
    text-align:center;
  }

  .print-table .col-cela{
    width:6%;
    text-align:center;
  }

  .print-table .col-at{
    width:24%;
  }

  .print-table .col-data{
    width:15%;
    text-align:center;
  }

  .group-title{
    text-align:left;
    font-size:11pt;
    font-weight:800;
    margin:0 0 2mm;
  }

  tr{
    break-inside:avoid;
    page-break-inside:avoid;
  }
}
</style>
</head>

<body>

<header>
  <h1>POLÍCIA PENAL DE MATO GROSSO DO SUL</h1>
  <div class="cpaig">CPAIG</div>
  <h2>Sistema de Atendimento — Guichê V2.3</h2>
</header>

<div class="container">

  <div class="card">

    <div class="grid">

      <div class="field" style="grid-column:span 2">

        <label>NOME DO INTERNO</label>

        <div class="name-wrap">

          <input
            id="nome"
            autocomplete="off"
            placeholder="Digite o nome do interno"
          >

          <div
            id="suggestions"
            class="suggestions hidden"
          ></div>

        </div>

      </div>

      <div class="field">

        <label>RGI</label>

        <input
          id="rgi"
          placeholder="RGI"
        >

      </div>

      <div class="field">

        <label>PAVILHÃO</label>

        <select id="pavilhao">

          <option value="">Selecione</option>
          <option>A</option>
          <option>B</option>
          <option>C</option>
          <option>D</option>
          <option>DISCIPLINAR</option>
          <option>DISCIPLINAR RISCO</option>
          <option>CP</option>
          <option>VIRTUAL</option>

        </select>

      </div>

      <div class="field">

        <label>CELA</label>

        <select id="cela">
          <option value="">Selecione</option>
        </select>

      </div>

      <div class="field">

        <label>ATENDIMENTO</label>

        <select id="atendimento">
          <option value="">Selecione</option>
        </select>

      </div>

      <div class="field">

        <label>DATA DO ATENDIMENTO</label>

        <div style="display:flex;gap:6px">

          <input
            id="dataAtendimento"
            type="date"
          >

          <button
            class="btn secondary"
            type="button"
            onclick="hoje()"
          >
            HOJE
          </button>

        </div>

      </div>

      <div
        class="field"
        style="grid-column:span 4"
      >

        <label>ASSUNTO</label>

        <input
          id="assunto"
          placeholder="Descreva o assunto"
        >

      </div>

    </div>

    <div class="actions">

      <button
        class="btn primary"
        onclick="adicionarFila()"
      >
        ➕ ADICIONAR À FILA
      </button>

      <button
        class="btn success"
        onclick="enviarFila()"
      >
        📤 ENVIAR PARA A MESA
      </button>

      <button
        class="btn warning"
        onclick="abrirArquivo()"
      >
        📁 ATENDIMENTOS GUARDADOS
      </button>

      <button
        class="btn secondary"
        onclick="abrirImpressao()"
      >
        🖨️ IMPRIMIR
      </button>

      <button
        class="btn secondary"
        onclick="abrirAtualizarBase()"
      >
        🔄 ATUALIZAR BASE DE INTERNOS
      </button>

      <input
        id="excelInput"
        type="file"
        accept=".xlsx,.xls"
        class="hidden"
      >

    </div>

    <div
      id="baseStatus"
      class="status"
    ></div>

    <div
      id="status"
      class="status"
    ></div>

  </div>


  <div class="card">

    <div class="toolbar">

      <h3 style="margin:0">
        Fila de atendimento
      </h3>

      <button
        class="btn danger"
        onclick="limparFila()"
      >
        Limpar fila
      </button>

    </div>

    <div style="overflow:auto;margin-top:10px">

      <table>

        <thead>

          <tr>
            <th>Nome</th>
            <th>RGI</th>
            <th>Pavilhão</th>
            <th>Cela</th>
            <th>Atendimento</th>
            <th>Data</th>
            <th>Assunto</th>
            <th>Ação</th>
          </tr>

        </thead>

        <tbody id="filaBody"></tbody>

      </table>

    </div>

  </div>


  <div class="card">

    <div class="toolbar">

      <h3 style="margin:0">
        Histórico do GUICHÊ
      </h3>

      <select
        id="ordemHistorico"
        onchange="renderHistorico()"
      >

        <option value="envio">
          Ordem de envio
        </option>

        <option value="atendimento">
          Por atendimento
        </option>

      </select>

    </div>

    <div style="overflow:auto;margin-top:10px">

      <table>

        <thead>

          <tr>
            <th>Nome</th>
            <th>RGI</th>
            <th>Pavilhão</th>
            <th>Cela</th>
            <th>Atendimento</th>
            <th>Data</th>
            <th>Status</th>
            <th>Ação</th>
          </tr>

        </thead>

        <tbody id="historicoBody"></tbody>

      </table>

    </div>

  </div>

</div>


<!-- ÁREA DE ATENDIMENTOS GUARDADOS -->

<div
  id="arquivoModal"
  class="modal"
>

  <div class="modal-box">

    <div class="modal-head">

      <h3>
        📁 Atendimentos guardados
      </h3>

      <button
        class="btn secondary"
        onclick="fecharArquivo()"
      >
        Fechar
      </button>

    </div>

    <div class="modal-grid">

      <div>

        <label>Data</label>

        <input
          id="arquivoData"
          type="date"
          onchange="renderArquivo()"
        >

      </div>

      <div>

        <label>Atendimento</label>

        <select
          id="arquivoAtendimento"
          onchange="renderArquivo()"
        >

          <option value="">
            Todos
          </option>

        </select>

      </div>

      <div>

        <label>Nome</label>

        <input
          id="arquivoNome"
          placeholder="Filtrar por nome"
          oninput="renderArquivo()"
        >

      </div>

    </div>

    <div
      id="arquivoCount"
      class="status"
    ></div>

    <div
      class="archive-list"
      id="arquivoList"
    ></div>

    <div class="modal-actions">

      <button
        class="btn secondary"
        onclick="selecionarTodosArquivo(true)"
      >
        Selecionar todos
      </button>

      <button
        class="btn secondary"
        onclick="selecionarTodosArquivo(false)"
      >
        Desmarcar
      </button>

      <button
        class="btn primary"
        onclick="restaurarArquivados()"
      >
        ↩️ Restaurar selecionados
      </button>

    </div>

  </div>

</div>


<!-- ÁREA DE IMPRESSÃO -->

<div
  id="printModal"
  class="modal"
>

  <div class="modal-box">

    <div class="modal-head">

      <h3>
        🖨️ Impressão
      </h3>

      <button
        class="btn secondary"
        onclick="fecharImpressao()"
      >
        Fechar
      </button>

    </div>

    <div class="modal-grid">

      <div>

        <label>
          Tipo de impressão
        </label>

        <select
          id="tipoImpressao"
          onchange="atualizarOpcoesImpressao()"
        >

          <option value="atendimento">
            Por atendimento
          </option>

          <option value="geral">
            Por atendimento geral
          </option>

          <option value="data">
            Por data
          </option>

        </select>

      </div>

      <div
        id="dataPrintWrap"
        class="hidden"
      >

        <label>
          Data
        </label>

        <input
          id="dataPrint"
          type="date"
          onchange="atualizarAtendimentosDaData()"
        >

      </div>

      <div
        id="modoDataWrap"
        class="hidden"
      >

        <label>
          Por data
        </label>

        <div
          style="display:flex;gap:10px;margin-top:9px"
        >

          <label>
            <input
              type="radio"
              name="modoData"
              value="todos"
              checked
              onchange="atualizarAtendimentosDaData()"
            >
            Todos
          </label>

          <label>
            <input
              type="radio"
              name="modoData"
              value="atendimentos"
              onchange="atualizarAtendimentosDaData()"
            >
            Atendimentos
          </label>

        </div>

      </div>

    </div>


    <div
      id="listaAtendimentosWrap"
      style="margin-top:15px"
    >

      <label>
        Selecione os atendimentos
      </label>

      <div
        id="listaAtendimentos"
        class="checks"
      ></div>

    </div>


    <div
      id="atendimentosDataWrap"
      class="hidden"
      style="margin-top:15px"
    >

      <label>
        Atendimentos da data
      </label>

      <div
        id="atendimentosData"
        class="checks"
      ></div>

    </div>


    <div
      style="margin-top:15px"
    >

      <label>
        <input
          type="checkbox"
          id="umPorPagina"
        >

        Um atendimento por página
      </label>

    </div>


    <div
      id="printInfo"
      class="status"
    ></div>


    <div class="modal-actions">

      <button
        class="btn secondary"
        onclick="fecharImpressao()"
      >
        Cancelar
      </button>

      <button
        class="btn primary"
        onclick="executarImpressao()"
      >
        🖨️ IMPRIMIR
      </button>

    </div>

  </div>

</div>


<div
  id="printArea"
  class="print-area"
></div>


<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>
"use strict";

/* =========================================================
   CONFIGURAÇÕES
========================================================= */

const STORAGE_HISTORICO = "atendimentoV2Historico";
const STORAGE_OUTBOX = "atendimentoV2Outbox";
const STORAGE_ARQUIVO = "atendimentoV23Arquivo";
const STORAGE_BASE = "atendimentoV23BaseInternos";
const STORAGE_BASE_DATA = "atendimentoV23BaseData";

const ATENDIMENTOS = [
  "Jurídico",
  "Psicossocial",
  "Médico",
  "Odontologia",
  "Trabalho",
  "Chefia",
  "Chefe de equipe",
  "Portaria II",
  "Identificação",
  "Limpeza",
  "Advogado(a)",
  "Visita Assistida",
  "Autorização de Saída",
  "Licença Judicial",
  "7 dias",
  "7 dias monitorado",
  "Alvará",
  "Salvo conduto",
  "Domiciliar",
  "Evasão",
  "Desvio de Rota",
  "Falta",
  "Regressão",
  "Mudança de Cela",
  "Hospitalizado",
  "Outros"
];

let fila = [];
let historico = carregarJSON(STORAGE_HISTORICO, []);
let outbox = carregarJSON(STORAGE_OUTBOX, []);
let arquivo = carregarJSON(STORAGE_ARQUIVO, []);
let baseInternos = carregarJSON(STORAGE_BASE, []);

let socket = null;
let reconnectTimer = null;
let sugestaoIndex = -1;


/* =========================================================
   FUNÇÕES BÁSICAS
========================================================= */

function carregarJSON(chave, padrao) {
  try {
    const valor = localStorage.getItem(chave);

    if (!valor) {
      return padrao;
    }

    const dados = JSON.parse(valor);

    return dados ?? padrao;

  } catch (erro) {
    console.error("Erro ao carregar", chave, erro);
    return padrao;
  }
}


function salvarJSON(chave, valor) {
  localStorage.setItem(
    chave,
    JSON.stringify(valor)
  );
}


function novoId() {
  if (
    window.crypto &&
    crypto.randomUUID
  ) {
    return crypto.randomUUID();
  }

  return (
    Date.now().toString(36) +
    Math.random().toString(36).slice(2)
  );
}


function escapeHtml(valor) {

  return String(valor ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function normalizarTexto(valor) {

  return String(valor ?? "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toUpperCase()
    .trim();
}


function formatarData(data) {

  if (!data) {
    return "";
  }

  const partes = String(data).split("-");

  if (partes.length === 3) {
    return `${partes[2]}/${partes[1]}/${partes[0]}`;
  }

  return data;
}


function hojeISO() {

  const agora = new Date();

  const ano = agora.getFullYear();

  const mes = String(
    agora.getMonth() + 1
  ).padStart(2, "0");

  const dia = String(
    agora.getDate()
  ).padStart(2, "0");

  return `${ano}-${mes}-${dia}`;
}


function hoje() {

  document.getElementById(
    "dataAtendimento"
  ).value = hojeISO();

}


function mostrarStatus(texto, tipo = "") {

  const elemento =
    document.getElementById("status");

  elemento.textContent = texto;

  if (tipo === "erro") {
    elemento.style.background = "#fde8e8";
    elemento.style.color = "#991b1b";
  } else if (tipo === "sucesso") {
    elemento.style.background = "#e8f5ec";
    elemento.style.color = "#17663a";
  } else {
    elemento.style.background = "#f4f6f8";
    elemento.style.color = "#17202a";
  }

}


/* =========================================================
   CELA
========================================================= */

function preencherCelas() {

  const select =
    document.getElementById("cela");

  select.innerHTML =
    '<option value="">Selecione</option>';

  for (let i = 1; i <= 120; i++) {

    const numero =
      String(i).padStart(2, "0");

    const option =
      document.createElement("option");

    option.value = numero;
    option.textContent = numero;

    select.appendChild(option);
  }

}


/* =========================================================
   ATENDIMENTOS
========================================================= */

function preencherAtendimentos() {

  const select =
    document.getElementById(
      "atendimento"
    );

  select.innerHTML =
    '<option value="">Selecione</option>';

  ATENDIMENTOS.forEach(
    atendimento => {

      const option =
        document.createElement("option");

      option.value = atendimento;
      option.textContent = atendimento;

      select.appendChild(option);

    }
  );

}


/* =========================================================
   BASE DO EXCEL
========================================================= */

function atualizarStatusBase() {

  const elemento =
    document.getElementById(
      "baseStatus"
    );

  const atualizado =
    localStorage.getItem(
      STORAGE_BASE_DATA
    );

  if (!baseInternos.length) {

    elemento.innerHTML =
      "<strong>Base de internos:</strong> nenhuma base carregada. " +
      "Use o botão <strong>ATUALIZAR BASE DE INTERNOS</strong>.";

    return;
  }

  elemento.innerHTML =
    `<strong>Base de internos:</strong> ${baseInternos.length} registros` +
    (
      atualizado

async function importarExcel(evento) {

  const arquivoSelecionado =
    evento.target.files &&
    evento.target.files[0];

  if (!arquivoSelecionado) {
    return;
  }

  try {

    mostrarStatus(
      "Lendo a base de internos...",
      ""
    );

    const dados =
      await arquivoSelecionado.arrayBuffer();

    const workbook =
      XLSX.read(
        dados,
        {
          type: "array"
        }
      );

    const primeiraAba =
      workbook.SheetNames[0];

    const planilha =
      workbook.Sheets[
        primeiraAba
      ];

    const linhas =
      XLSX.utils.sheet_to_json(
        planilha,
        {
          defval: ""
        }
      );

    const novaBase = [];

    linhas.forEach(linha => {

      const chaves =
        Object.keys(linha);

      function obterCampo(...nomes) {

        for (
          const nome of nomes
        ) {

          const encontrado =
            chaves.find(
              chave =>
                normalizarTexto(
                  chave
                ) ===
                normalizarTexto(
                  nome
                )
            );

          if (
            encontrado !==
            undefined
          ) {

            return String(
              linha[
                encontrado
              ] ?? ""
            ).trim();

          }

        }

        return "";
      }

      const nome =
        obterCampo(
          "NOME DO INTERNO",
          "NOME",
          "NOME INTERNO"
        );

      const rgi =
        obterCampo(
          "RGI",
          "PRONTUARIO",
          "PRONTUÁRIO"
        );

      const pavilhao =
        obterCampo(
          "PAVILHAO",
          "PAVILHÃO",
          "PAV"
        );

      const cela =
        obterCampo(
          "CELA"
        );

      if (nome) {

        novaBase.push({
          nome,
          rgi,
          pavilhao,
          cela
        });

      }

    });


    if (!novaBase.length) {

      throw new Error(
        "Não encontrei registros válidos. " +
        "Verifique se o Excel possui as colunas " +
        "NOME DO INTERNO, RGI, PAVILHÃO e CELA."
      );

    }


    baseInternos =
      novaBase;

    salvarJSON(
      STORAGE_BASE,
      baseInternos
    );


    const agora =
      new Date();

    const dataHora =
      agora.toLocaleString(
        "pt-BR"
      );

    localStorage.setItem(
      STORAGE_BASE_DATA,
      dataHora
    );


    atualizarStatusBase();

    mostrarStatus(
      `Base atualizada com sucesso: ${baseInternos.length} internos carregados.`,
      "sucesso"
    );

  } catch (erro) {

    console.error(
      "Erro ao importar Excel:",
      erro
    );

    mostrarStatus(
      "Não foi possível importar o Excel: " +
      erro.message,
      "erro"
    );

  }

}


/* =========================================================
   BUSCA DE INTERNO
========================================================= */

function pesquisarInternos(texto) {

  const termo =
    normalizarTexto(texto);

  if (!termo) {
    return [];
  }

  return baseInternos
    .filter(interno => {

      return normalizarTexto(
        interno.nome
      ).includes(termo);

    })
    .sort((a, b) => {

      const na =
        normalizarTexto(a.nome);

      const nb =
        normalizarTexto(b.nome);

      const aComeca =
        na.startsWith(termo);

      const bComeca =
        nb.startsWith(termo);

      if (
        aComeca &&
        !bComeca
      ) {
        return -1;
      }

      if (
        !aComeca &&
        bComeca
      ) {
        return 1;
      }

      return na.localeCompare(nb);

    })
    .slice(0, 20);

}


function mostrarSugestoes() {

  const input =
    document.getElementById(
      "nome"
    );

  const caixa =
    document.getElementById(
      "suggestions"
    );

  const resultados =
    pesquisarInternos(
      input.value
    );

  caixa.innerHTML = "";

  sugestaoIndex = -1;

  if (!input.value.trim()) {

    caixa.classList.add(
      "hidden"
    );

    return;
  }

  if (!resultados.length) {

    caixa.classList.add(
      "hidden"
    );

    return;
  }


  resultados.forEach(
    (interno, indice) => {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "suggestion";

      div.dataset.index =
        indice;

      div.innerHTML =
        `<strong>${escapeHtml(interno.nome)}</strong>` +
        `<small>RGI: ${escapeHtml(interno.rgi || "-")} ` +
        `| Pavilhão: ${escapeHtml(interno.pavilhao || "-")} ` +
        `| Cela: ${escapeHtml(interno.cela || "-")}</small>`;

      div.addEventListener(
        "mousedown",
        evento => {

          evento.preventDefault();

          selecionarInterno(
            interno
          );

        }
      );

      caixa.appendChild(
        div
      );

    }
  );

  caixa.classList.remove(
    "hidden"
  );

}


function selecionarInterno(interno) {

  document.getElementById(
    "nome"
  ).value = interno.nome || "";

  document.getElementById(
    "rgi"
  ).value = interno.rgi || "";

  document.getElementById(
    "pavilhao"
  ).value =
    interno.pavilhao || "";

  document.getElementById(
    "cela"
  ).value =
    normalizarCela(
      interno.cela
    );

  esconderSugestoes();

}


function normalizarCela(valor) {

  if (
    valor === null ||
    valor === undefined ||
    valor === ""
  ) {
    return "";
  }

  const numero =
    String(valor)
      .replace(/\D/g, "");

  if (!numero) {
    return "";
  }

  const n =
    Number(numero);

  if (
    n < 1 ||
    n > 120
  ) {
    return "";
  }

  return String(n).padStart(2, "0");

}


function esconderSugestoes() {

  document
    .getElementById(
      "suggestions"
    )
    .classList.add(
      "hidden"
    );

  sugestaoIndex = -1;

}


function navegarSugestoes(evento) {

  const caixa =
    document.getElementById(
      "suggestions"
    );

  const itens =
    caixa.querySelectorAll(
      ".suggestion"
    );

  if (
    caixa.classList.contains(
      "hidden"
    ) ||
    !itens.length
  ) {
    return;
  }

  if (
    evento.key ===
    "ArrowDown"
  ) {

    evento.preventDefault();

    sugestaoIndex =
      (sugestaoIndex + 1) %
      itens.length;

  }

  else if (
    evento.key ===
    "ArrowUp"
  ) {

    evento.preventDefault();

    sugestaoIndex =
      (sugestaoIndex - 1 +
        itens.length) %
      itens.length;

  }

  else if (
    evento.key ===
    "Enter"
  ) {

    if (
      sugestaoIndex >= 0 &&
      sugestaoIndex <
        itens.length
    ) {

      evento.preventDefault();

      itens[
        sugestaoIndex
      ].dispatchEvent(
        new MouseEvent(
          "mousedown"
        )
      );

    }

    return;

  } else {

    return;

  }

  itens.forEach(
    (item, indice) => {

      item.classList.toggle(
        "active",
        indice ===
          sugestaoIndex
      );

    }
  );

}

/* =========================================================
   WEBSOCKET
========================================================= */

function obterWsUrl() {

  const protocolo =
    location.protocol === "https:"
      ? "wss:"
      : "ws:";

  return (
    protocolo +
    "//" +
    location.host
  );

}


function conectarWebSocket() {

  if (
    socket &&
    (
      socket.readyState ===
        WebSocket.OPEN ||
      socket.readyState ===
        WebSocket.CONNECTING
    )
  ) {
    return;
  }

  try {

    socket =
      new WebSocket(
        obterWsUrl()
      );

  } catch (erro) {

    agendarReconexao();

    return;

  }


  socket.addEventListener(
    "open",
    () => {

      socket.send(
        JSON.stringify({
          type:
            "register",
          role:
            "sender"
        })
      );

      mostrarStatus(
        "Conectado à MESA.",
        "sucesso"
      );

      enviarPendentes();

    }
  );


  socket.addEventListener(
    "message",
    evento => {

      let mensagem;

      try {

        mensagem =
          JSON.parse(
            evento.data
          );

      } catch {

        return;

      }


      if (
        mensagem.type ===
        "connected"
      ) {

        return;

      }


      if (
        mensagem.type ===
        "registered"
      ) {

        return;

      }


      if (
        mensagem.type ===
        "record_received"
      ) {

        marcarComoRecebido(
          mensagem.recordId,
          mensagem.receivedAt
        );

      }


      if (
        mensagem.type ===
        "error"
      ) {

        mostrarStatus(
          mensagem.message ||
          "Erro no servidor.",
          "erro"
        );

      }

    }
  );


  socket.addEventListener(
    "close",
    () => {

      mostrarStatus(
        "MESA desconectada. Tentando reconectar...",
        ""
      );

      agendarReconexao();

    }
  );


  socket.addEventListener(
    "error",
    () => {

      try {
        socket.close();
      } catch {}

    }
  );

}


function agendarReconexao() {

  if (
    reconnectTimer
  ) {
    return;
  }

  reconnectTimer =
    setTimeout(
      () => {

        reconnectTimer =
          null;

        conectarWebSocket();

      },
      1000
    );

}


function enviarMensagem(dados) {

  if (
    socket &&
    socket.readyState ===
      WebSocket.OPEN
  ) {

    socket.send(
      JSON.stringify(
        dados
      )
    );

    return true;

  }

  return false;

}


/* =========================================================
   ENVIO PARA MESA
========================================================= */

function enviarFila() {

  if (!fila.length) {

    mostrarStatus(
      "A fila está vazia.",
      "erro"
    );

    return;

  }


  const registros =
    [...fila];


  registros.forEach(
    registro => {

      const item = {

        ...registro,

        status:
          "enviado",

        enviadoEm:
          new Date()
            .toISOString()

      };


      historico.push(
        item
      );


      const jaExiste =
        outbox.some(
          x =>
            x.recordId ===
            item.recordId
        );


      if (!jaExiste) {

        outbox.push(
          item
        );

      }


      enviarMensagem({
        type:
          "send_record",

        recordId:
          item.recordId,

        record:
          item,

        sentAt:
          item.enviadoEm

      });

    }
  );


  salvarJSON(
    STORAGE_HISTORICO,
    historico
  );

  salvarJSON(
    STORAGE_OUTBOX,
    outbox
  );


  fila = [];

  renderFila();

  renderHistorico();


  mostrarStatus(
    socket &&
    socket.readyState ===
      WebSocket.OPEN
      ? "Atendimentos enviados para a MESA."
      : "Atendimentos guardados para envio. Serão enviados automaticamente quando a conexão voltar.",
    "sucesso"
  );


  enviarPendentes();

}


function enviarPendentes() {

  if (
    !socket ||
    socket.readyState !==
      WebSocket.OPEN
  ) {
    return;
  }


  outbox.forEach(
    item => {

      enviarMensagem({

        type:
          "send_record",

        recordId:
          item.recordId,

        record:
          item,

        sentAt:
          item.enviadoEm ||
          item.criadoEm

      });

    }
  );

}


function marcarComoRecebido(
  recordId,
  receivedAt
) {

  let alterou = false;


  historico =
    historico.map(
      item => {

        if (
          item.recordId ===
          recordId
        ) {

          alterou = true;

          return {

            ...item,

            status:
              "recebido",

            recebidoEm:
              receivedAt ||
              new Date()
                .toISOString()

          };

        }

        return item;

      }
    );


  if (alterou) {

    outbox =
      outbox.filter(
        item =>
          item.recordId !==
          recordId
      );


    salvarJSON(
      STORAGE_HISTORICO,
      historico
    );

    salvarJSON(
      STORAGE_OUTBOX,
      outbox
    );

    renderHistorico();

  }

}


/* =========================================================
   HISTÓRICO
========================================================= */

function obterHistoricoOrdenado() {

  const lista =
    [...historico];


  const ordem =
    document.getElementById(
      "ordemHistorico"
    ).value;


  if (
    ordem ===
    "atendimento"
  ) {

    lista.sort(
      (a, b) =>
        String(
          a.atendimento || ""
        ).localeCompare(
          String(
            b.atendimento || ""
          ),
          "pt-BR"
        ) ||
        new Date(
          a.enviadoEm ||
          a.criadoEm ||
          0
        ) -
        new Date(
          b.enviadoEm ||
          b.criadoEm ||
          0
        )
    );

  } else {

    lista.sort(
      (a, b) =>
        new Date(
          a.enviadoEm ||
          a.criadoEm ||
          0
        ) -
        new Date(
          b.enviadoEm ||
          b.criadoEm ||
          0
        )
    );

  }


  return lista;

}


function renderHistorico() {

  const body =
    document.getElementById(
      "historicoBody"
    );

  body.innerHTML = "";


  const lista =
    obterHistoricoOrdenado();


  lista.forEach(
    item => {

      const tr =
        document.createElement(
          "tr"
        );


      const recebido =
        item.status ===
        "recebido";


      tr.innerHTML = `

        <td>
          ${escapeHtml(item.nome)}
        </td>

        <td>
          ${escapeHtml(item.rgi)}
        </td>

        <td>
          ${escapeHtml(item.pavilhao)}
        </td>

        <td class="center">
          ${escapeHtml(item.cela)}
        </td>

        <td>
          ${escapeHtml(item.atendimento)}
        </td>

        <td>
          ${escapeHtml(
            formatarData(
              item.dataAtendimento
            )
          )}
        </td>

        <td>

          <span class="badge ${
            recebido
              ? ""
              : "pending"
          }">

            ${
              recebido
                ? "Recebido"
                : "Aguardando"
            }

          </span>

        </td>

        <td>

          ${
            recebido
              ? `
                <button
                  class="btn warning"
                  onclick="guardarHistorico('${item.recordId}')"
                >
                  📁 Guardar
                </button>
              `
              : `
                <span class="muted">
                  Aguardando MESA
                </span>
              `
          }

        </td>

      `;


      body.appendChild(
        tr
      );

    }
  );

}


function guardarHistorico(
  recordId
) {

  const indice =
    historico.findIndex(
      item =>
        item.recordId ===
        recordId
    );


  if (
    indice < 0
  ) {
    return;
  }


  const item =
    historico[indice];


  if (
    item.status !==
    "recebido"
  ) {

    mostrarStatus(
      "Somente atendimentos recebidos podem ser guardados.",
      "erro"
    );

    return;

  }


  arquivo.push({

    ...item,

    guardadoEm:
      new Date()
        .toISOString(),

    origem:
      "guiche"

  });


  historico.splice(
    indice,
    1
  );


  salvarJSON(
    STORAGE_ARQUIVO,
    arquivo
  );

  salvarJSON(
    STORAGE_HISTORICO,
    historico
  );


  renderHistorico();

  mostrarStatus(
    "Atendimento guardado com sucesso.",
    "sucesso"
  );

}

      `<div style="padding:15px;text-align:center;color:#667085">
        Nenhum atendimento guardado encontrado.
      </div>`;

    return;

  }


  resultados.forEach(
    item => {

      const label =
        document.createElement(
          "label"
        );


      label.innerHTML = `

        <input
          type="checkbox"
          class="arquivoCheck"
          value="${escapeHtml(item.recordId)}"
        >

        <span>

          <strong>
            ${escapeHtml(item.nome)}
          </strong>

          <br>

          <small>

            RGI:
            ${escapeHtml(item.rgi || "-")}

            |
            Pavilhão:
            ${escapeHtml(item.pavilhao || "-")}

            |
            Cela:
            ${escapeHtml(item.cela || "-")}

            |
            Atendimento:
            ${escapeHtml(item.atendimento || "-")}

            |
            Data:
            ${escapeHtml(
              formatarData(
                item.dataAtendimento
              )
            )}

          </small>

        </span>

      `;


      lista.appendChild(
        label
      );

    }
  );

}


function selecionarTodosArquivo(
  marcar
) {

  document
    .querySelectorAll(
      ".arquivoCheck"
    )
    .forEach(
      checkbox => {
        checkbox.checked =
          marcar;
      }
    );

}


function restaurarArquivados() {

  const selecionados =
    Array.from(
      document.querySelectorAll(
        ".arquivoCheck:checked"
      )
    ).map(
      checkbox =>
        checkbox.value
    );


  if (!selecionados.length) {

    mostrarStatus(
      "Selecione pelo menos um atendimento.",
      "erro"
    );

    return;

  }


  const restaurados = [];


  arquivo =
    arquivo.filter(
      item => {

        if (
          selecionados.includes(
            item.recordId
          )
        ) {

          restaurados.push(
            item
          );

          return false;

        }

        return true;

      }
    );


  restaurados.forEach(
    item => {

      historico.push({

        ...item,

        status:
          "recebido",

        restauradoEm:
          new Date()
            .toISOString()

      });

    }
  );


  salvarJSON(
    STORAGE_ARQUIVO,
    arquivo
  );

  salvarJSON(
    STORAGE_HISTORICO,
    historico
  );


  renderHistorico();

  renderArquivo();


  mostrarStatus(
    `${restaurados.length} atendimento(s) restaurado(s).`,
    "sucesso"
  );

}


/* =========================================================
   DADOS PARA IMPRESSÃO
========================================================= */

/*
  A impressão considera:
  1. Histórico atual
  2. Atendimentos guardados

  Dessa forma, quando for feita uma impressão por data,
  os atendimentos arquivados também estarão disponíveis.
*/

function todosRegistrosParaImpressao() {

  const mapa =
    new Map();


  [
    ...historico,
    ...arquivo
  ].forEach(
    item => {

      if (
        !item ||
        !item.recordId
      ) {
        return;
      }

      mapa.set(
        item.recordId,
        item
      );

    }
  );


  return Array.from(
    mapa.values()
  );

}


function abrirImpressao() {

  preencherListaAtendimentos();

  document
    .getElementById(
      "printModal"
    )
    .classList.add("open");

  atualizarOpcoesImpressao();

}


function fecharImpressao() {

  document
    .getElementById(
      "printModal"
    )
    .classList.remove("open");

}


function preencherListaAtendimentos() {

  const container =
    document.getElementById(
      "listaAtendimentos"
    );

  container.innerHTML = "";


  ATENDIMENTOS.forEach(
    atendimento => {

      const label =
        document.createElement(
          "label"
        );


      label.innerHTML = `

        <input
          type="checkbox"
          class="checkAtendimento"
          value="${escapeHtml(atendimento)}"
        >

        <span>
          ${escapeHtml(atendimento)}
        </span>

      `;


      container.appendChild(
        label
      );

    }
  );

}


function obterTipoImpressao() {

  return document.getElementById(
    "tipoImpressao"
  ).value;

}


function atualizarOpcoesImpressao() {

  const tipo =
    obterTipoImpressao();


  const dataWrap =
    document.getElementById(
      "dataPrintWrap"
    );

  const modoWrap =
    document.getElementById(
      "modoDataWrap"
    );

  const listaWrap =
    document.getElementById(
      "listaAtendimentosWrap"
    );

  const dataAtWrap =
    document.getElementById(
      "atendimentosDataWrap"
    );


  dataWrap.classList.toggle(
    "hidden",
    tipo !== "data"
  );


  modoWrap.classList.toggle(
    "hidden",
    tipo !== "data"
  );


  /*
    Para "Por atendimento" mostramos
    a seleção múltipla.
  */

  listaWrap.classList.toggle(
    "hidden",
    tipo === "data"
  );


  if (
    tipo !== "data"
  ) {

    dataAtWrap.classList.add(
      "hidden"
    );

  }


  if (
    tipo === "data"
  ) {

    atualizarAtendimentosDaData();

  }


  atualizarInformacaoImpressao();

}


function obterModoData() {

  const selecionado =
    document.querySelector(
      'input[name="modoData"]:checked'
    );

  return selecionado
    ? selecionado.value
    : "todos";

}


function atualizarAtendimentosDaData() {

  const data =
    document.getElementById(
      "dataPrint"
    ).value;

  const modo =
    obterModoData();


  const wrap =
    document.getElementById(
      "atendimentosDataWrap"
    );

  const container =
    document.getElementById(
      "atendimentosData"
    );


  container.innerHTML = "";


  if (
    modo !==
    "atendimentos"
  ) {

    wrap.classList.add(
      "hidden"
    );

    atualizarInformacaoImpressao();

    return;

  }


  wrap.classList.remove(
    "hidden"
  );


  const registros =
    todosRegistrosParaImpressao()
      .filter(
        item =>
          !data ||
          item.dataAtendimento ===
            data
      );


  const existentes =
    new Set(
      registros
        .map(
          item =>
            item.atendimento
        )
        .filter(Boolean)
    );


  ATENDIMENTOS
    .filter(
      atendimento =>
        existentes.has(
          atendimento
        )
    )
    .forEach(
      atendimento => {

        const label =
          document.createElement(
            "label"
          );


        label.innerHTML = `

          <input
            type="checkbox"
            class="checkAtendimentoData"
            value="${escapeHtml(atendimento)}"
          >

          <span>
            ${escapeHtml(atendimento)}
          </span>

        `;


        container.appendChild(
          label
        );

      }
    );


  if (
    !container.children.length
  ) {

    container.innerHTML =
      `<div class="muted">
        Nenhum atendimento encontrado para esta data.
      </div>`;

  }


  atualizarInformacaoImpressao();

}


function obterAtendimentosSelecionados(
  classe
) {

  return Array.from(
    document.querySelectorAll(
      classe
    )
  )
  .filter(
    checkbox =>
      checkbox.checked
  )
  .map(
    checkbox =>
      checkbox.value
  );

}


function atualizarInformacaoImpressao() {

  const info =
    document.getElementById(
      "printInfo"
    );

  const tipo =
    obterTipoImpressao();


  if (
    tipo ===
    "atendimento"
  ) {

    const selecionados =
      obterAtendimentosSelecionados(
        ".checkAtendimento"
      );

    info.textContent =
      selecionados.length
        ? `${selecionados.length} tipo(s) de atendimento selecionado(s).`
        : "Selecione um ou mais tipos de atendimento.";

    return;

  }


  if (
    tipo ===
    "geral"
  ) {

    info.textContent =
      "Será impressa a lista geral de atendimentos.";

    return;

  }


  const data =
    document.getElementById(
      "dataPrint"
    ).value;

  const modo =
    obterModoData();


  if (!data) {

    info.textContent =
      "Escolha uma data.";

    return;

  }


  if (
    modo ===
    "todos"
  ) {

    const quantidade =
      todosRegistrosParaImpressao()
        .filter(
          item =>
            item.dataAtendimento ===
            data
        )
        .length;

    info.textContent =
      `${quantidade} atendimento(s) encontrado(s) na data selecionada.`;

  } else {

    const selecionados =
      obterAtendimentosSelecionados(
        ".checkAtendimentoData"
      );

    info.textContent =
      selecionados.length
        ? `${selecionados.length} tipo(s) selecionado(s) para a data.`
        : "Selecione um ou mais tipos de atendimento.";

  }

}


/* =========================================================
   PREPARAÇÃO DOS REGISTROS
========================================================= */

function ordenarRegistros(
  registros
) {

  return [...registros].sort(
    (a, b) => {

      const dataA =
        a.dataAtendimento ||
        "";

      const dataB =
        b.dataAtendimento ||
        "";

      return (
        dataA.localeCompare(
          dataB
        ) ||
        String(
          a.atendimento ||
          ""
        ).localeCompare(
          String(
            b.atendimento ||
            ""
          ),
          "pt-BR"
        ) ||
        new Date(
          a.enviadoEm ||
          a.criadoEm ||
          0
        ) -
        new Date(
          b.enviadoEm ||
          b.criadoEm ||
          0
        )
      );

    }
  );

}


function filtrarParaImpressao() {

  const registros =
    todosRegistrosParaImpressao();


  const tipo =
    obterTipoImpressao();


  if (
    tipo ===
    "atendimento"
  ) {

    const selecionados =
      obterAtendimentosSelecionados(
        ".checkAtendimento"
      );


    if (
      !selecionados.length
    ) {

      throw new Error(
        "Selecione pelo menos um tipo de atendimento."
      );

    }


    return registros.filter(
      item =>
        selecionados.includes(
          item.atendimento
        )
    );

  }


  if (
    tipo ===
    "geral"
  ) {

    return registros;

  }


  const data =
    document.getElementById(
      "dataPrint"
    ).value;


  if (!data) {

    throw new Error(
      "Selecione a data da impressão."
    );

  }


  const registrosDaData =
    registros.filter(
      item =>
        item.dataAtendimento ===
        data
    );


  if (
    obterModoData() ===
    "todos"
  ) {

    return registrosDaData;

  }


  const selecionados =
    obterAtendimentosSelecionados(
      ".checkAtendimentoData"
    );


  if (
    !selecionados.length
  ) {

    throw new Error(
      "Selecione pelo menos um tipo de atendimento."
    );

  }


  return registrosDaData.filter(
    item =>
      selecionados.includes(
        item.atendimento
      )
  );

}


/* =========================================================
   IMPRESSÃO
========================================================= */

function executarImpressao() {

  try {

    const registros =
      filtrarParaImpressao();


    if (!registros.length) {

      throw new Error(
        "Nenhum atendimento encontrado para os filtros escolhidos."
      );

    }


    gerarAreaImpressao(
      registros
    );


    fecharImpressao();


    /*
      Pequeno atraso para garantir que
      o navegador terminou de montar
      a área de impressão antes de
      abrir a janela.
    */

    setTimeout(
      () => {

        window.print();

      },
      150
    );


  } catch (erro) {

    alert(
      erro.message
    );

  }

}


function criarCabecalhoPagina(
  tituloExtra = ""
) {

  return `

    <div class="print-title">
      CPAIG - LISTA DE ATENDIMENTOS
    </div>

    ${
      tituloExtra
        ? `
          <div class="group-title">
            ${escapeHtml(
              tituloExtra
            )}
          </div>
        `
        : ""
    }

  `;

}


function montarTabela(
  registros
) {

  const linhas =
    registros.map(
      item => `

        <tr>

          <td class="col-nome">
            ${escapeHtml(
              item.nome
            )}
          </td>

          <td class="col-rgi">
            ${escapeHtml(
              item.rgi
            )}
          </td>

          <td class="col-pav">
            ${escapeHtml(
              item.pavilhao
            )}
          </td>

          <td class="col-cela">
            ${escapeHtml(
              item.cela
            )}
          </td>

          <td class="col-at">
            ${escapeHtml(
              item.atendimento
            )}
          </td>

          <td class="col-data">
            ${escapeHtml(
              formatarData(
                item.dataAtendimento
              )
            )}
          </td>

        </tr>

      `
    ).join("");


  return `

    <table class="print-table">

      <thead>

        <tr>

          <th class="col-nome">
            Nome
          </th>

          <th class="col-rgi">
            RGI
          </th>

          <th class="col-pav">
            Pavilhão
          </th>

          <th class="col-cela">
            Cela
          </th>

          <th class="col-at">
            Atendimento
          </th>

          <th class="col-data">
            Data
          </th>

        </tr>

      </thead>

      <tbody>
        ${linhas}
      </tbody>

    </table>

  `;

}


/*
  IMPORTANTE:

  Quando "Um atendimento por página" estiver marcado,
  cada grupo de atendimento é colocado dentro de uma
  .print-page separada.

  Não criamos uma página geral antes dos grupos.

  Isso evita:
  - primeira página com tudo junto;
  - páginas seguintes vazias;
  - grupos duplicados.
*/

function gerarAreaImpressao(
  registros
) {

  const area =
    document.getElementById(
      "printArea"
    );

  const tipo =
    obterTipoImpressao();

  const umPorPagina =
    document.getElementById(
      "umPorPagina"
    ).checked;


  area.innerHTML = "";


  const ordenados =
    ordenarRegistros(
      registros
    );


  /*
    POR ATENDIMENTO
  */

  if (
    tipo ===
    "atendimento"
  ) {

    const grupos =
      agruparPorAtendimento(
        ordenados
      );


    if (
      umPorPagina
    ) {

      grupos.forEach(
        grupo => {

          area.insertAdjacentHTML(
            "beforeend",

            `

              <section class="print-page">

                ${criarCabecalhoPagina(
                  grupo.nome
                )}

                ${montarTabela(
                  grupo.registros
                )}

              </section>

            `
          );

        }
      );

    } else {

      let html =
        `<section class="print-page">
          ${criarCabecalhoPagina()}
        `;


      grupos.forEach(
        grupo => {

          html += `

            <div
              class="group-title"
              style="margin-top:4mm"
            >
              ${escapeHtml(
                grupo.nome
              )}
            </div>

            ${montarTabela(
              grupo.registros
            )}

          `;

        }
      );


      html +=
        "</section>";


      area.innerHTML =
        html;

    }

    return;

  }


  /*
    POR ATENDIMENTO GERAL
  */

  if (
    tipo ===
    "geral"
  ) {

    const grupos =
      agruparPorAtendimento(
        ordenados
      );


    if (
      umPorPagina
    ) {

      grupos.forEach(
        grupo => {

          area.insertAdjacentHTML(
            "beforeend",

            `

              <section class="print-page">

                ${criarCabecalhoPagina(
                  grupo.nome
                )}

                ${montarTabela(
                  grupo.registros
                )}

              </section>

            `

          );

        }
      );

    } else {

      area.innerHTML = `

        <section class="print-page">

          ${criarCabecalhoPagina()}

          ${montarTabela(
            ordenados
          )}

        </section>

      `;

    }

    return;

  }


  /*
    POR DATA
  */

  const data =
    document.getElementById(
      "dataPrint"
    ).value;


  const grupos =
    agruparPorAtendimento(
      ordenados
    );


  if (
    umPorPagina
  ) {

    grupos.forEach(
      grupo => {

        area.insertAdjacentHTML(
          "beforeend",

          `

            <section class="print-page">

              ${criarCabecalhoPagina(
                `${grupo.nome} — ${formatarData(data)}`
              )}

              ${montarTabela(
                grupo.registros
              )}

            </section>

          `

        );

      }
    );

  } else {

    area.innerHTML = `

      <section class="print-page">

        ${criarCabecalhoPagina(
          `Data: ${formatarData(data)}`
        )}

        ${montarTabela(
          ordenados
        )}

      </section>

    `;

  }

}


function agruparPorAtendimento(
  registros
) {

  const mapa =
    new Map();


  registros.forEach(
    item => {

      const nome =
        item.atendimento ||
        "Outros";


      if (
        !mapa.has(nome)
      ) {

        mapa.set(
          nome,
          []
        );

      }


      mapa.get(nome).push(
        item
      );

    }
  );


  return Array.from(
    mapa.entries()
  )
  .sort(
    (a, b) =>
      a[0].localeCompare(
        b[0],
        "pt-BR"
      )
  )
  .map(
    ([nome, registros]) => ({
      nome,
      registros
    })
  );

}


/* =========================================================
   ATUALIZAÇÃO DOS FILTROS DE IMPRESSÃO
========================================================= */

document.addEventListener(
  "change",
  evento => {

    if (
      evento.target.matches(
        ".checkAtendimento"
      )
    ) {

      atualizarInformacaoImpressao();

    }

    if (
      evento.target.matches(
        ".checkAtendimentoData"
      )
    ) {

      atualizarInformacaoImpressao();

    }

  }
);


/* =========================================================
   FECHAMENTO DO MODAL AO CLICAR FORA
========================================================= */

document.addEventListener(
  "click",
  evento => {

    const arquivoModal =
      document.getElementById(
        "arquivoModal"
      );

    const printModal =
      document.getElementById(
        "printModal"
      );


    if (
      evento.target ===
      arquivoModal
    ) {

      fecharArquivo();

    }


    if (
      evento.target ===
      printModal
    ) {

      fecharImpressao();

    }

  }
);

  <script>
/* =========================================================
   INICIALIZAÇÃO
========================================================= */

function inicializar() {

  preencherCelas();

  preencherAtendimentos();

  document.getElementById(
    "dataAtendimento"
  ).value = hojeISO();

  atualizarStatusBase();

  renderFila();

  renderHistorico();

  conectarWebSocket();

}


/* =========================================================
   EVENTOS DO CAMPO NOME
========================================================= */

document.getElementById(
  "nome"
).addEventListener(
  "input",
  () => {

    mostrarSugestoes();

  }
);


document.getElementById(
  "nome"
).addEventListener(
  "keydown",
  evento => {

    navegarSugestoes(
      evento
    );

  }
);


document.getElementById(
  "nome"
).addEventListener(
  "focus",
  () => {

    if (
      document.getElementById(
        "nome"
      ).value.trim()
    ) {

      mostrarSugestoes();

    }

  }
);


document.getElementById(
  "nome"
).addEventListener(
  "blur",
  () => {

    /*
      Pequeno atraso para permitir
      que o clique em uma sugestão
      seja processado.
    */

    setTimeout(
      esconderSugestoes,
      180
    );

  }
);


/* =========================================================
   EVENTO DO EXCEL
========================================================= */

document.getElementById(
  "excelInput"
).addEventListener(
  "change",
  importarExcel
);


/* =========================================================
   TECLA ESC
========================================================= */

document.addEventListener(
  "keydown",
  evento => {

    if (
      evento.key !==
      "Escape"
    ) {
      return;
    }


    fecharArquivo();

    fecharImpressao();

    esconderSugestoes();

  }
);


/* =========================================================
   IMPRESSÃO — LIMPEZA APÓS WINDOW.PRINT
========================================================= */

window.addEventListener(
  "afterprint",
  () => {

    const area =
      document.getElementById(
        "printArea"
      );

    /*
      Mantemos a área montada,
      pois alguns navegadores podem
      precisar dela durante o diálogo
      de impressão.
    */

    if (
      area &&
      !area.innerHTML.trim()
    ) {
      area.innerHTML = "";
    }

  }
);


/* =========================================================
   INÍCIO DO SISTEMA
========================================================= */

inicializar();

</script>
