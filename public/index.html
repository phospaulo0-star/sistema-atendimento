<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
Guichê de Atendimento — V2
</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f3f5;
  color: #222;
}

header {
  background: #111;
  color: white;
  padding: 20px;
  border-bottom: 4px solid #c7a84b;
}

header h1 {
  margin: 0;
  font-size: 22px;
}

header p {
  margin: 6px 0 0;
  color: #ddd;
}

main {
  max-width: 1050px;
  margin: 25px auto;
  padding: 0 16px;
}

.card {
  background: white;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 2px 9px rgba(0,0,0,.08);
}

.status {
  padding: 11px;
  border-radius: 7px;
  background: #f9dddd;
  color: #8a1f1f;
  font-weight: bold;
  margin-bottom: 15px;
}

.status.online {
  background: #ddf3e1;
  color: #17652b;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}

.campo {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

label {
  font-weight: bold;
}

input,
select {
  width: 100%;
  padding: 12px;
  border: 1px solid #bbb;
  border-radius: 7px;
  font-size: 16px;
}

button {
  border: 0;
  border-radius: 7px;
  padding: 13px 18px;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
}

.primary {
  width: 100%;
  margin-top: 16px;
  background: #222;
  color: white;
}

.send {
  width: 100%;
  margin-top: 12px;
  background: #c7a84b;
  color: #111;
}

.item {
  border-left: 5px solid #c7a84b;
  background: #fafafa;
  padding: 13px;
  border-radius: 7px;
  margin: 9px 0;
}

.badge {
  display: inline-block;
  margin-top: 8px;
  padding: 5px 9px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: bold;
  background: #fff1c7;
  color: #745800;
}

.badge.ok {
  background: #d9f2dd;
  color: #1c6828;
}

.muted {
  color: #777;
}

.empty {
  padding: 25px;
  text-align: center;
  color: #777;
  border: 2px dashed #ddd;
  border-radius: 8px;
}

@media(max-width:700px) {

  .grid {
    grid-template-columns: 1fr;
  }

  header h1 {
    font-size: 18px;
  }

}

</style>

</head>

<body>

<header>

<h1>
POLÍCIA PENAL DE MATO GROSSO DO SUL
</h1>

<p>
Sistema de Atendimento — Guichê V2
</p>

</header>

<main>

<section class="card">

<div
  id="status"
  class="status"
>
🔴 Conectando ao servidor...
</div>

<h2>
Novo atendimento
</h2>

<div class="grid">

<div class="campo">

<label>Nome</label>

<input
  id="nome"
  placeholder="Digite o nome"
>

</div>

<div class="campo">

<label>Identificação</label>

<input
  id="identificacao"
  placeholder="Digite a identificação"
>

</div>

<div class="campo">

<label>Pavilhão</label>

<select id="pavilhao">

<option value="">
Selecione
</option>

<option>A</option>
<option>B</option>
<option>C</option>
<option>D</option>
<option>DISCIPLINAR</option>
<option>DISCIPLINAR RISCO</option>
<option>CP</option>
<option>VIRTUAL</option>

</select>

</div>

<div class="campo">

<label>
Cela (01–120)
</label>

<input
  id="cela"
  list="celas"
  inputmode="numeric"
  placeholder="Ex.: 01"
>

<datalist id="celas"></datalist>

</div>

<div class="campo">

<label>
Atendimento
</label>

<input
  id="atendimento"
  list="tipos"
  placeholder="Digite ou selecione"
>

<datalist id="tipos">

<option value="Médico">
<option value="Odontologia">
<option value="Psicossocial">
<option value="Jurídico">
<option value="Trabalho">
<option value="Chefia">
<option value="Chefe de equipe">
<option value="Portaria II">
<option value="Identificação">
<option value="Limpeza">
<option value="Advogado(a)">
<option value="Visita Assistida">
<option value="Autorização de Saída">
<option value="Audiência">
<option value="Escolta">
<option value="Videoconferência">
<option value="Defensoria">
<option value="Administração">
<option value="Outros">

</datalist>

</div>

<div class="campo">

<label>
Assunto
</label>

<input
  id="assunto"
  placeholder="Opcional"
>

</div>

</div>

<button
  class="primary"
  onclick="adicionar()"
>
➕ ADICIONAR À FILA
</button>

</section>


<section class="card">

<h2>
Fila
</h2>

<div
  id="fila"
  class="empty"
>
Nenhum atendimento na fila.
</div>

<button
  class="send"
  onclick="enviar()"
>
📤 ENVIAR PARA A MESA
</button>

</section>


<section class="card">

<h2>
Últimos atendimentos
</h2>

<div
  id="historico"
  class="empty"
>
Nenhum atendimento enviado ainda.
</div>

</section>

</main>


<script>

let ws = null;

let fila = [];

let historico =
  JSON.parse(
    localStorage.getItem(
      "atendimentoV2Historico"
    ) || "[]"
  );


for (
  let n = 1;
  n <= 120;
  n++
) {

  const option =
    document.createElement(
      "option"
    );

  option.value =
    String(n).padStart(2,"0");

  document
    .getElementById("celas")
    .appendChild(option);

}


function esc(valor) {

  return String(
    valor == null ? "" : valor
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;");

}


function hora(valor) {

  return valor
    ? new Date(valor)
        .toLocaleString("pt-BR")
    : "";

}


function renderFila() {

  const elemento =
    document.getElementById(
      "fila"
    );

  if (!fila.length) {

    elemento.innerHTML =
      '<div class="empty">' +
      'Nenhum atendimento na fila.' +
      '</div>';

    return;
  }

  elemento.innerHTML =
    fila.map(
      (registro, indice) => {

        return `
        <div class="item">

        <b>
        ${indice + 1}.
        ${esc(registro.nome)}
        </b>

        <br>

        Identificação:
        ${esc(registro.identificacao)}

        <br>

        Pavilhão:
        ${esc(registro.pavilhao)}

        <br>

        Cela:
        ${esc(registro.cela)}

        <br>

        Atendimento:
        ${esc(registro.atendimento)}

        ${
          registro.assunto
            ? "<br>Assunto: " +
              esc(registro.assunto)
            : ""
        }

        </div>
        `;

      }
    ).join("");

}


function renderHistorico() {

  const elemento =
    document.getElementById(
      "historico"
    );

  if (!historico.length) {

    elemento.innerHTML =
      '<div class="empty">' +
      'Nenhum atendimento enviado ainda.' +
      '</div>';

    return;
  }

  elemento.innerHTML =
    historico
      .slice(0,20)
      .map(
        registro => {

          return `
          <div class="item">

          <b>
          ${esc(
            registro.registro.nome
          )}
          </b>

          <br>

          ${esc(
            registro.registro.atendimento
          )}

          — Cela
          ${esc(
            registro.registro.cela
          )}

          <br>

          <span class="muted">
          Enviado:
          ${hora(
            registro.enviadoEm
          )}
          </span>

          <br>

          <span
            class="badge
            ${
              registro.recebidoEm
                ? "ok"
                : ""
            }"
          >

          ${
            registro.recebidoEm
              ? "✓ RECEBIDO ÀS " +
                hora(
                  registro.recebidoEm
                )
              : "⏳ AGUARDANDO MESA"
          }

          </span>

          </div>
          `;

        }
      )
      .join("");

}


function limpar() {

  [
    "nome",
    "identificacao",
    "pavilhao",
    "cela",
    "atendimento",
    "assunto"
  ]
  .forEach(
    id => {

      document
        .getElementById(id)
        .value = "";

    }
  );

}


function adicionar() {

  const valorCela =
    document
      .getElementById("cela")
      .value
      .trim();

  const registro = {

    nome:
      document
        .getElementById("nome")
        .value
        .trim(),

    identificacao:
      document
        .getElementById(
          "identificacao"
        )
        .value
        .trim(),

    pavilhao:
      document
        .getElementById(
          "pavilhao"
        )
        .value,

    cela:
      valorCela.padStart(2,"0"),

    atendimento:
      document
        .getElementById(
          "atendimento"
        )
        .value
        .trim(),

    assunto:
      document
        .getElementById(
          "assunto"
        )
        .value
        .trim()

  };


  if (
    !registro.nome ||
    !registro.identificacao ||
    !registro.pavilhao ||
    !valorCela ||
    !registro.atendimento
  ) {

    alert(
      "Preencha Nome, Identificação, " +
      "Pavilhão, Cela e Atendimento."
    );

    return;
  }


  if (
    !/^\d+$/.test(valorCela) ||
    Number(valorCela) < 1 ||
    Number(valorCela) > 120
  ) {

    alert(
      "A cela deve estar entre 01 e 120."
    );

    return;
  }


  fila.push(registro);

  limpar();

  renderFila();

}


function enviar() {

  if (!fila.length) {

    alert(
      "Não há atendimentos na fila."
    );

    return;
  }


  if (
    !ws ||
    ws.readyState !==
    WebSocket.OPEN
  ) {

    alert(
      "O Guichê não está conectado."
    );

    return;
  }


  fila.forEach(
    registro => {

      const recordId =
        crypto.randomUUID();

      historico.unshift({

        recordId,

        registro,

        enviadoEm:
          new Date()
            .toISOString(),

        recebidoEm:
          null

      });


      ws.send(
        JSON.stringify({

          type:
            "send_record",

          recordId,

          record:
            registro

        })
      );

    }
  );


  fila = [];

  localStorage.setItem(
    "atendimentoV2Historico",
    JSON.stringify(
      historico
    )
  );

  renderFila();

  renderHistorico();

}


function conectar() {

  const protocolo =
    location.protocol ===
    "https:"
      ? "wss:"
      : "ws:";


  ws =
    new WebSocket(
      protocolo +
      "//" +
      location.host
    );


  ws.onopen =
    () => {

      const status =
        document.getElementById(
          "status"
        );

      status.className =
        "status online";

      status.textContent =
        "🟢 Conectado ao servidor";


      ws.send(
        JSON.stringify({

          type:
            "register",

          role:
            "sender"

        })
      );

    };


  ws.onclose =
    () => {

      const status =
        document.getElementById(
          "status"
        );

      status.className =
        "status";

      status.textContent =
        "🔴 Desconectado — tentando reconectar...";


      setTimeout(
        conectar,
        3000
      );

    };


  ws.onmessage =
    event => {

      try {

        const mensagem =
          JSON.parse(
            event.data
          );


        if (
          mensagem.type ===
          "record_received"
        ) {

          const registro =
            historico.find(
              item =>
                item.recordId ===
                mensagem.recordId
            );


          if (registro) {

            registro.recebidoEm =
              mensagem.receivedAt;


            localStorage.setItem(
              "atendimentoV2Historico",
              JSON.stringify(
                historico
              )
            );


            renderHistorico();

          }

        }

      } catch (_) {}

    };

}


renderFila();

renderHistorico();

conectar();

</script>

</body>
</html>
