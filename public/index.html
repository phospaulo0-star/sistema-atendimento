<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Guichê de Atendimento - Polícia Penal MS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f3f3;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 25px;
      display: flex;
      align-items: center;
      gap: 18px;
      border-bottom: 4px solid #c7a84b;
    }

    header img {
      width: 65px;
      height: 65px;
      object-fit: contain;
    }

    header h1 {
      margin: 0;
      font-size: 23px;
    }

    header p {
      margin: 5px 0 0;
      color: #d5d5d5;
      font-size: 14px;
    }

    .container {
      max-width: 1000px;
      margin: 25px auto;
      padding: 0 18px;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-top: 0;
      color: #222;
      border-bottom: 2px solid #c7a84b;
      padding-bottom: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .campo {
      display: flex;
      flex-direction: column;
    }

    .campo label {
      font-weight: bold;
      margin-bottom: 6px;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #bbb;
      border-radius: 6px;
      font-size: 16px;
      background: white;
    }

    button {
      border: none;
      border-radius: 7px;
      padding: 13px 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-adicionar {
      background: #222;
      color: white;
      width: 100%;
      margin-top: 18px;
    }

    .btn-adicionar:hover {
      background: #000;
    }

    .btn-enviar {
      background: #c7a84b;
      color: #111;
      width: 100%;
      margin-top: 18px;
      font-size: 18px;
    }

    .btn-enviar:hover {
      background: #b59638;
    }

    .fila-item {
      border: 1px solid #ddd;
      border-left: 5px solid #c7a84b;
      padding: 14px;
      margin-bottom: 10px;
      border-radius: 6px;
      background: #fafafa;
    }

    .fila-item strong {
      display: block;
      margin-bottom: 5px;
    }

    .status {
      padding: 12px;
      border-radius: 6px;
      background: #eee;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .status.online {
      background: #dff4e3;
      color: #17652b;
    }

    .status.offline {
      background: #f8dddd;
      color: #8a1f1f;
    }

    .confirmacao {
      margin-top: 15px;
      padding: 15px;
      border-radius: 7px;
      background: #e5f4e7;
      border: 1px solid #9ac9a1;
      color: #185b24;
      font-weight: bold;
    }

    .sem-confirmacao {
      margin-top: 15px;
      padding: 15px;
      border-radius: 7px;
      background: #f5f5f5;
      border: 1px solid #ddd;
      color: #666;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-top: 7px;
    }

    .badge-pendente {
      background: #fff1c7;
      color: #745800;
    }

    .badge-confirmado {
      background: #d9f2dd;
      color: #1c6828;
    }

    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }

      header h1 {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

<header>

  <img
    src="https://www.agepen.ms.gov.br/wp-content/uploads/2023/06/Brasao-PPMS-site.png"
    alt="Polícia Penal MS"
  >

  <div>
    <h1>POLÍCIA PENAL DE MATO GROSSO DO SUL</h1>
    <p>Sistema de Atendimento — Guichê</p>
  </div>

</header>

<div class="container">

  <div class="card">

    <div
      id="statusConexao"
      class="status offline"
    >
      🔴 Conectando ao servidor...
    </div>

    <h2>Novo Atendimento</h2>

    <div class="grid">

      <div class="campo">
        <label for="pavilhao">
          Pavilhão
        </label>

        <select id="pavilhao">

          <option value="">
            Selecione
          </option>

          <option>A</option>
          <option>B</option>
          <option>C</option>
          <option>D</option>
          <option>DISCIPLINAR</option>
          <option>DISCIPLINAR RISCO</option>
          <option>CP</option>
          <option>VIRTUAL</option>

        </select>
      </div>

      <div class="campo">

        <label for="cela">
          Cela
        </label>

        <input
          id="cela"
          list="listaCela"
          placeholder="Digite ou selecione a cela"
        >

        <datalist id="listaCela">
        </datalist>

      </div>

      <div class="campo">

        <label for="atendimento">
          Atendimento
        </label>

        <input
          id="atendimento"
          list="listaAtendimento"
          placeholder="Digite ou selecione"
        >

        <datalist id="listaAtendimento">

          <option value="Médico">
          <option value="Odontológico">
          <option value="Psicológico">
          <option value="Jurídico">
          <option value="Social">
          <option value="Administrativo">
          <option value="Outro">

          <option value="PSICOSSOCIAL">
          <option value="CHEFIA">
          <option value="7 DIAS NORMAL">
          <option value="7 DIAS COM TORNOZELEIRA">
          <option value="ABERTO DOMICILIAR">
          <option value="ALVARÁ">
          <option value="SALVO CONDUTO">
          <option value="LICENÇA JUDICIAL">
          <option value="DESVIO DE ROTA">
          <option value="PORTARIA II">
          <option value="CHEFE DE EQUIPE">
          <option value="ADMINISTRAÇÃO">
          <option value="DEFENSORIA">
          <option value="SETOR DE TRABALHO">
          <option value="AUTORIZAÇÃO DE SAÍDA">
          <option value="ADVOGADO(A)">
          <option value="AUDIÊNCIA">
          <option value="ESCOLTA">
          <option value="VIDEOCONFERÊNCIA">
          <option value="OUTROS">

        </datalist>

      </div>

    </div>

    <button
      class="btn-adicionar"
      onclick="adicionarFila()"
    >
      ➕ ADICIONAR À FILA
    </button>

  </div>


  <div class="card">

    <h2>Fila de Atendimento</h2>

    <div id="fila">

      <div class="sem-confirmacao">
        Nenhum atendimento na fila.
      </div>

    </div>

    <button
      class="btn-enviar"
      onclick="enviarFila()"
    >
      📤 ENVIAR PARA A MESA
    </button>

  </div>


  <div class="card">

    <h2>Últimos Atendimentos</h2>

    <div id="historico">

      <div class="sem-confirmacao">
        Nenhum atendimento enviado ainda.
      </div>

    </div>

  </div>

</div>


<script>

  // ==========================================
  // PREENCHER CELAS 01 ATÉ 120
  // ==========================================

  const listaCela =
    document.getElementById(
      "listaCela"
    );

  for (
    let i = 1;
    i <= 120;
    i++
  ) {

    const numero =
      String(i).padStart(2, "0");

    const option =
      document.createElement(
        "option"
      );

    option.value =
      numero;

    listaCela.appendChild(
      option
    );

  }


  // ==========================================
  // FILA LOCAL
  // ==========================================

  let fila = [];


  // ==========================================
  // HISTÓRICO
  // ==========================================

  let historico = [];


  // ==========================================
  // WEBSOCKET
  // ==========================================

  let ws;


  function conectar() {

    const protocolo =
      location.protocol === "https:"
        ? "wss:"
        : "ws:";

    ws = new WebSocket(
      protocolo +
      "//" +
      location.host
    );


    ws.onopen = function() {

      atualizarStatus(
        true
      );

      ws.send(
        JSON.stringify({
          type: "register",
          role: "sender"
        })
      );

    };


    ws.onclose = function() {

      atualizarStatus(
        false
      );

      setTimeout(
        conectar,
        3000
      );

    };


    ws.onerror = function() {

      atualizarStatus(
        false
      );

    };


    ws.onmessage =
      function(event) {

        let msg;

        try {

          msg =
            JSON.parse(
              event.data
            );

        } catch {

          return;

        }


        // ==================================
        // CONFIRMAÇÃO DA MESA
        // ==================================

        if (
          msg.type ===
          "record_received"
        ) {

          registrarConfirmacao(
            msg.recordId,
            msg.receivedAt
          );

        }

      };

  }


  // ==========================================
  // STATUS DA CONEXÃO
  // ==========================================

  function atualizarStatus(
    online
  ) {

    const elemento =
      document.getElementById(
        "statusConexao"
      );

    if (online) {

      elemento.className =
        "status online";

      elemento.textContent =
        "🟢 Conectado ao servidor";

    } else {

      elemento.className =
        "status offline";

      elemento.textContent =
        "🔴 Desconectado — tentando reconectar...";

    }

  }


  // ==========================================
  // ADICIONAR À FILA
  // ==========================================

  function adicionarFila() {

    const pavilhao =
      document.getElementById(
        "pavilhao"
      ).value;

    const cela =
      document.getElementById(
        "cela"
      ).value.trim();

    const atendimento =
      document.getElementById(
        "atendimento"
      ).value.trim();


    if (
      !pavilhao ||
      !cela ||
      !atendimento
    ) {

      alert(
        "Preencha Pavilhão, Cela e Atendimento."
      );

      return;

    }


    const registro = {

      pavilhao,
      cela,
      atendimento

    };


    fila.push(
      registro
    );


    document.getElementById(
      "pavilhao"
    ).value = "";

    document.getElementById(
      "cela"
    ).value = "";

    document.getElementById(
      "atendimento"
    ).value = "";


    renderizarFila();

  }


  // ==========================================
  // MOSTRAR FILA
  // ==========================================

  function renderizarFila() {

    const elemento =
      document.getElementById(
        "fila"
      );


    if (
      fila.length === 0
    ) {

      elemento.innerHTML =
        `
        <div class="sem-confirmacao">
          Nenhum atendimento na fila.
        </div>
        `;

      return;

    }


    elemento.innerHTML =
      fila.map(
        (item, index) => {

          return `
            <div class="fila-item">

              <strong>
                ${index + 1}. ${item.atendimento}
              </strong>

              Pavilhão:
              ${item.pavilhao}
              <br>

              Cela:
              ${item.cela}

            </div>
          `;

        }
      ).join("");

  }


  // ==========================================
  // ENVIAR FILA
  // ==========================================

  function enviarFila() {

    if (
      fila.length === 0
    ) {

      alert(
        "Não há atendimentos na fila."
      );

      return;

    }


    if (
      !ws ||
      ws.readyState !==
        WebSocket.OPEN
    ) {

      alert(
        "O Guichê não está conectado ao servidor."
      );

      return;

    }


    fila.forEach(
      (registro) => {

        const recordId =
          crypto.randomUUID();


        const itemHistorico = {

          recordId,

          registro,

          enviadoEm:
            new Date().toISOString(),

          recebidoEm:
            null

        };


        historico.unshift(
          itemHistorico
        );


        ws.send(
          JSON.stringify({

            type:
              "send_record",

            recordId,

            record:
              registro

          })
        );

      }
    );


    fila = [];


    renderizarFila();
    renderizarHistorico();

  }


  // ==========================================
  // CONFIRMAÇÃO RECEBIDA
  // ==========================================

  function registrarConfirmacao(
    recordId,
    receivedAt
  ) {

    const item =
      historico.find(
        (registro) =>
          registro.recordId ===
          recordId
      );


    if (!item) {
      return;
    }


    item.recebidoEm =
      receivedAt;


    renderizarHistorico();

  }


  // ==========================================
  // HISTÓRICO
  // ==========================================

  function renderizarHistorico() {

    const elemento =
      document.getElementById(
        "historico"
      );


    if (
      historico.length === 0
    ) {

      elemento.innerHTML =
        `
        <div class="sem-confirmacao">
          Nenhum atendimento enviado ainda.
        </div>
        `;

      return;

    }


    elemento.innerHTML =
      historico
        .slice(0, 20)
        .map(
          (item) => {

            const dataEnvio =
              new Date(
                item.enviadoEm
              );


            let blocoConfirmacao;


            if (
              item.recebidoEm
            ) {

              const dataRecebimento =
                new Date(
                  item.recebidoEm
                );


              blocoConfirmacao =
                `
                <div class="confirmacao">

                  ✓ RECEBIDO PELA MESA

                  <br>

                  Horário da confirmação:
                  ${formatarHorario(
                    dataRecebimento
                  )}

                  <span class="badge badge-confirmado">
                    CONFIRMADO
                  </span>

                </div>
                `;

            } else {

              blocoConfirmacao =
                `
                <div class="sem-confirmacao">

                  ⏳ Aguardando confirmação da Mesa...

                  <span class="badge badge-pendente">
                    PENDENTE
                  </span>

                </div>
                `;

            }


            return `
              <div class="fila-item">

                <strong>
                  ${item.registro.atendimento}
                </strong>

                Pavilhão:
                ${item.registro.pavilhao}
                <br>

                Cela:
                ${item.registro.cela}

                <br><br>

                Enviado:
                ${formatarHorario(
                  dataEnvio
                )}

                ${blocoConfirmacao}

              </div>
            `;

          }
        )
        .join("");

  }


  // ==========================================
  // FORMATA DATA/HORA
  // ==========================================

  function formatarHorario(
    data
  ) {

    return data.toLocaleString(
      "pt-BR",
      {
        dateStyle:
          "short",

        timeStyle:
          "medium"
      }
    );

  }


  // ==========================================
  // INICIAR
  // ==========================================

  renderizarFila();
  renderizarHistorico();
  conectar();

</script>

</body>
</html>
