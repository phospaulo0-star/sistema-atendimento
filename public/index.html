<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Atendimento</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      margin: 0;
      padding: 30px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,.12);
    }

    h1 {
      margin-top: 0;
    }

    input, textarea, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 10px;
      border-radius: 7px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    textarea {
      height: 120px;
      resize: vertical;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #1d4ed8;
    }

    .status {
      margin: 15px 0;
      padding: 10px;
      background: #eee;
      border-radius: 7px;
    }

    .recebido {
      margin-top: 20px;
      padding: 15px;
      background: #e8f5e9;
      border-radius: 8px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📡 Sistema de Atendimento</h1>

  <div class="status" id="status">
    Conectando...
  </div>

  <label>Modo:</label>

  <select id="modo">
    <option value="sender">Computador que envia</option>
    <option value="receiver">Computador que recebe</option>
  </select>

  <input
    id="nome"
    type="text"
    placeholder="Nome"
  >

  <textarea
    id="mensagem"
    placeholder="Digite a informação que deseja enviar..."
  ></textarea>

  <button onclick="enviar()">
    Enviar informação
  </button>

  <div class="recebido">
    <strong>Informação recebida:</strong>

    <div id="recebida">
      Nenhuma informação recebida.
    </div>
  </div>

</div>

<script>

let socket;

function conectar() {

  const protocolo =
    location.protocol === "https:"
      ? "wss:"
      : "ws:";

  socket = new WebSocket(
    protocolo + "//" + location.host
  );

  socket.onopen = function() {

    document.getElementById("status").innerText =
      "🟢 Conectado";

    registrar();
  };

  socket.onclose = function() {

    document.getElementById("status").innerText =
      "🔴 Desconectado. Tentando novamente...";

    setTimeout(conectar, 2000);
  };

  socket.onerror = function() {

    document.getElementById("status").innerText =
      "⚠️ Erro de conexão";
  };

  socket.onmessage = function(event) {

    const data = JSON.parse(event.data);

    if (data.type === "new_record") {

      const texto =
        "Nome: " +
        (data.record.nome || "") +
        "\n\n" +
        "Mensagem:\n" +
        (data.record.mensagem || "");

      document.getElementById("recebida").innerText =
        texto;
    }
  };
}

function registrar() {

  const modo =
    document.getElementById("modo").value;

  if (socket.readyState === WebSocket.OPEN) {

    socket.send(JSON.stringify({
      type: "register",
      role: modo
    }));
  }
}

document.getElementById("modo")
  .addEventListener("change", registrar);

function enviar() {

  if (!socket || socket.readyState !== WebSocket.OPEN) {

    alert("O computador ainda não está conectado.");

    return;
  }

  const nome =
    document.getElementById("nome").value;

  const mensagem =
    document.getElementById("mensagem").value;

  if (!mensagem.trim()) {

    alert("Digite uma mensagem.");

    return;
  }

  socket.send(JSON.stringify({

    type: "send_record",

    record: {
      nome: nome,
      mensagem: mensagem
    }

  }));

  document.getElementById("mensagem").value = "";

  alert("Informação enviada!");
}

conectar();

</script>

</body>
</html>
