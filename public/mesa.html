<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Mesa de Atendimento V2</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f2f2f2;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 20px;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    .cpaig {
      margin-top: 6px;
      color: #f2c94c;
      font-weight: bold;
      font-size: 18px;
    }

    .subtitulo {
      margin-top: 8px;
      font-size: 16px;
    }

    main {
      max-width: 1000px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.10);
    }

    .status {
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .online {
      background: #d9f5df;
      color: #176b2e;
    }

    .offline {
      background: #ffe0e0;
      color: #9b1c1c;
    }

    .botoes {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn {
      background: #333;
      color: white;
    }

    .btn-print {
      background: #1769aa;
      color: white;
    }

    .btn-receber {
      background: #16803c;
      color: white;
    }

    .controles {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .controles label {
      font-weight: bold;
    }

    .controles select {
      padding: 10px;
      border: 1px solid #bbb;
      border-radius: 8px;
      font-size: 15px;
    }

    .item {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 12px;
      background: #fafafa;
    }

    .item.pendente {
      border-left: 6px solid #e2a400;
    }

    .item.confirmado {
      border-left: 6px solid #16803c;
    }

    .item-topo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .nome {
      font-size: 20px;
      font-weight: bold;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
    }

    .badge-pendente {
      background: #ffe4a3;
      color: #765300;
    }

    .badge-confirmado {
      background: #ccefd4;
      color: #176b2e;
    }

    .dados {
      line-height: 1.7;
    }

    .vazio {
      text-align: center;
      color: #777;
      padding: 25px;
    }

    #listaImpressao {
      display: none;
    }

    @media print {

      body * {
        visibility: hidden !important;
      }

      #listaImpressao,
      #listaImpressao * {
        visibility: visible !important;
      }

      #listaImpressao {
        display: block !important;
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        padding: 20px;
      }

      #listaImpressao h1 {
        text-align: center;
        margin-bottom: 20px;
      }

      #listaImpressao h2 {
        margin-top: 20px;
        border-bottom: 1px solid #000;
        padding-bottom: 5px;
      }

      #listaImpressao table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 15px;
      }

      #listaImpressao th,
      #listaImpressao td {
        border: 1px solid #000;
        padding: 6px;
        font-size: 12px;
      }

      #listaImpressao th {
        font-weight: bold;
      }
    }

  </style>
</head>

<body>

<header>

  <h1>
    POLÍCIA PENAL DE MATO GROSSO DO SUL
  </h1>

  <div class="cpaig">
    CPAIG
  </div>

  <div class="subtitulo">
    Mesa de Recebimento — Sistema de Atendimento V2
  </div>

</header>


<main>

  <div
    id="status"
    class="status offline"
  >
    ● Desconectado
  </div>


  <section class="card">

    <div class="botoes">

      <button
        class="btn"
        onclick="ativarNotificacoes()"
      >
        🔔 NOTIFICAÇÕES
      </button>

      <button
        class="btn"
        onclick="alternarSom()"
        id="btnSom"
      >
        🔊 SOM: ON
      </button>

      <button
        class="btn-print"
        onclick="imprimirLista()"
      >
        🖨️ IMPRIMIR LISTA
      </button>

    </div>

  </section>


  <section class="card">

    <h2>
      Histórico de atendimentos recebidos
    </h2>

    <div class="controles">

      <label for="ordemMesa">
        Visualizar:
      </label>

      <select
        id="ordemMesa"
        onchange="render()"
      >

        <option value="envio">
          Ordem de envio
        </option>

        <option value="atendimento">
          Por atendimento
        </option>

      </select>

    </div>


    <div id="fila"></div>

  </section>


  <div id="listaImpressao"></div>

</main>


<script>

  const WS_URL =
    (location.protocol === "https:" ? "wss://" : "ws://") +
    location.host;

  let ws = null;

  let somAtivo = true;


  let lista =
    JSON.parse(
      localStorage.getItem(
        "mesaAtendimentosV2"
      ) || "[]"
    );


  const filaEl =
    document.getElementById(
      "fila"
    );

  const statusEl =
    document.getElementById(
      "status"
    );


  function salvar() {

    localStorage.setItem(
      "mesaAtendimentosV2",
      JSON.stringify(lista)
    );
  }


  function atualizarStatus(
    online
  ) {

    if (online) {

      statusEl.textContent =
        "● Conectado";

      statusEl.className =
        "status online";

    } else {

      statusEl.textContent =
        "● Desconectado — aguardando reconexão";

      statusEl.className =
        "status offline";
    }
  }


  function conectar() {

    try {

      ws =
        new WebSocket(
          WS_URL
        );


      ws.onopen = () => {

        atualizarStatus(
          true
        );

        ws.send(
          JSON.stringify({
            type: "register",
            role: "receiver"
          })
        );
      };


      ws.onmessage = (
        event
      ) => {

        let mensagem;

        try {

          mensagem =
            JSON.parse(
              event.data
            );

        } catch {

          return;
        }


        if (
          mensagem.type ===
          "new_record"
        ) {

          receberAtendimento(
            mensagem
          );

          return;
        }


        if (
          mensagem.type ===
          "record_received"
        ) {

          confirmarLocal(
            mensagem.recordId,
            mensagem.receivedAt
          );
        }

      };


      ws.onclose = () => {

        atualizarStatus(
          false
        );

        setTimeout(
          conectar,
          3000
        );
      };


      ws.onerror = () => {

        atualizarStatus(
          false
        );
      };


    } catch {

      atualizarStatus(
        false
      );

      setTimeout(
        conectar,
        3000
      );
    }
  }


  function receberAtendimento(
    mensagem
  ) {

    const existente =
      lista.find(
        item =>
          item.recordId ===
          mensagem.recordId
      );


    if (existente) {

      /*
       * O atendimento já existe no histórico.
       * Não cria duplicado.
       */

      render();

      return;
    }


    const item = {

      recordId:
        mensagem.recordId,

      ...(
        mensagem.record ||
        {}
      ),

      enviadoEm:
        mensagem.sentAt ||
        new Date().toISOString(),

      recebidoEm:
        null

    };


    lista.unshift(
      item
    );

    salvar();

    render();


    if (
      somAtivo
    ) {
      tocarSom();
    }


    mostrarNotificacao(
      item
    );
  }


  function receberConfirmacao(
    recordId
  ) {

    if (
      !ws ||
      ws.readyState !==
        WebSocket.OPEN
    ) {
      return;
    }


    ws.send(
      JSON.stringify({
        type:
          "confirm_received",
        recordId
      })
    );
  }


  function marcarRecebido(
    recordId
  ) {

    const item =
      lista.find(
        x =>
          x.recordId ===
          recordId
      );


    if (!item) {
      return;
    }


    if (
      item.recebidoEm
    ) {
      return;
    }


    const agora =
      new Date().toISOString();


    item.recebidoEm =
      agora;


    salvar();

    render();


    receberConfirmacao(
      recordId
    );
  }


  function confirmarLocal(
    recordId,
    receivedAt
  ) {

    const item =
      lista.find(
        x =>
          x.recordId ===
          recordId
      );


    if (!item) {
      return;
    }


    item.recebidoEm =
      item.recebidoEm ||
      receivedAt;


    salvar();

    render();
  }


  function render() {

    if (!lista.length) {

      filaEl.innerHTML =
        '<div class="vazio">Nenhum atendimento recebido.</div>';

      return;
    }


    const ordem =
      document.getElementById(
        "ordemMesa"
      ).value;


    const ordenada =
      lista
        .slice()
        .sort(
          (a, b) => {

            if (
              ordem ===
              "atendimento"
            ) {

              const cmp =
                String(
                  a.atendimento ||
                  ""
                ).localeCompare(
                  String(
                    b.atendimento ||
                    ""
                  ),
                  "pt-BR"
                );

              if (
                cmp !== 0
              ) {
                return cmp;
              }
            }


            return (
              new Date(
                b.enviadoEm ||
                0
              ) -
              new Date(
                a.enviadoEm ||
                0
              )
            );
          }
        );


    filaEl.innerHTML =
      ordenada
        .map(
          item => {

            const confirmado =
              !!item.recebidoEm;


            return `

              <div
                class="item ${
                  confirmado
                    ? "confirmado"
                    : "pendente"
                }"
              >

                <div
                  class="item-topo"
                >

                  <div
                    class="nome"
                  >
                    ${escapeHtml(
                      item.nome
                    )}
                  </div>

                  <span
                    class="badge ${
                      confirmado
                        ? "badge-confirmado"
                        : "badge-pendente"
                    }"
                  >
                    ${
                      confirmado
                        ? "RECEBIDO"
                        : "AGUARDANDO RECEBIMENTO"
                    }
                  </span>

                </div>


                <div
                  class="dados"
                >

                  <div>
                    <strong>RGI:</strong>
                    ${escapeHtml(
                      item.rgi ||
                      ""
                    )}
                  </div>

                  <div>
                    <strong>Pavilhão:</strong>
                    ${escapeHtml(
                      item.pavilhao ||
                      ""
                    )}
                  </div>

                  <div>
                    <strong>Cela:</strong>
                    ${escapeHtml(
                      item.cela ||
                      ""
                    )}
                  </div>

                  <div>
                    <strong>Atendimento:</strong>
                    ${escapeHtml(
                      item.atendimento ||
                      ""
                    )}
                  </div>

                  ${
                    item.assunto
                      ? `
                        <div>
                          <strong>Assunto:</strong>
                          ${escapeHtml(
                            item.assunto
                          )}
                        </div>
                      `
                      : ""
                  }

                  <div>
                    <strong>Enviado em:</strong>
                    ${formatarData(
                      item.enviadoEm
                    )}
                  </div>

                  ${
                    item.recebidoEm
                      ? `
                        <div>
                          <strong>Recebido em:</strong>
                          ${formatarData(
                            item.recebidoEm
                          )}
                        </div>
                      `
                      : ""
                  }

                </div>


                ${
                  !confirmado
                    ? `
                      <div
                        style="margin-top:15px;"
                      >

                        <button
                          class="btn-receber"
                          onclick="marcarRecebido('${item.recordId}')"
                        >
                          ✓ RECEBIDO
                        </button>

                      </div>
                    `
                    : ""
                }

              </div>

            `;
          }
        )
        .join("");
  }


  function formatarData(
    data
  ) {

    if (!data) {
      return "-";
    }

    return new Date(
      data
    ).toLocaleString(
      "pt-BR"
    );
  }


  function escapeHtml(
    valor
  ) {

    return String(
      valor ?? ""
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );
  }


  function alternarSom() {

    somAtivo =
      !somAtivo;


    document.getElementById(
      "btnSom"
    ).textContent =
      somAtivo
        ? "🔊 SOM: ON"
        : "🔇 SOM: OFF";
  }


  function tocarSom() {

    try {

      const audio =
        new Audio();

      audio.src =
        "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=";

      audio.play()
        .catch(() => {});

    } catch {}
  }


  async function ativarNotificacoes() {

    if (
      !("Notification" in window)
    ) {

      alert(
        "Este navegador não oferece notificações."
      );

      return;
    }


    const permissao =
      await Notification.requestPermission();


    if (
      permissao === "granted"
    ) {

      alert(
        "Notificações ativadas."
      );

    } else {

      alert(
        "As notificações não foram autorizadas."
      );
    }
  }


  function mostrarNotificacao(
    item
  ) {

    if (
      !("Notification" in window)
    ) {
      return;
    }


    if (
      Notification.permission !==
      "granted"
    ) {
      return;
    }


    try {

      new Notification(
        "Novo atendimento",
        {
          body:
            item.nome +
            " — " +
            item.atendimento
        }
      );

    } catch {}
  }


  function imprimirLista() {

    const area =
      document.getElementById(
        "listaImpressao"
      );


    if (!lista.length) {

      alert(
        "Não há atendimentos para imprimir."
      );

      return;
    }


    const grupos = {};


    lista.forEach(
      item => {

        const tipo =
          item.atendimento ||
          "Sem atendimento";

        if (
          !grupos[tipo]
        ) {
          grupos[tipo] = [];
        }

        grupos[tipo].push(
          item
        );
      }
    );


    let html = `

      <h1>
        POLÍCIA PENAL DE MATO GROSSO DO SUL
      </h1>

      <div
        style="
          text-align:center;
          font-weight:bold;
          margin-bottom:20px;
        "
      >
        CPAIG — LISTA DE ATENDIMENTOS
      </div>

    `;


    Object.keys(
      grupos
    )
      .sort(
        (a, b) =>
          a.localeCompare(
            b,
            "pt-BR"
          )
      )
      .forEach(
        atendimento => {

          html += `

            <h2>
              ${escapeHtml(
                atendimento
              )}
            </h2>

            <table>

              <thead>

                <tr>
                  <th>Nome</th>
                  <th>Pavilhão</th>
                  <th>Cela</th>
                </tr>

              </thead>

              <tbody>

                ${grupos[
                  atendimento
                ]
                  .map(
                    item => `

                      <tr>

                        <td>
                          ${escapeHtml(
                            item.nome
                          )}
                        </td>

                        <td>
                          ${escapeHtml(
                            item.pavilhao ||
                            ""
                          )}
                        </td>

                        <td>
                          ${escapeHtml(
                            item.cela ||
                            ""
                          )}
                        </td>

                      </tr>

                    `
                  )
                  .join("")}

              </tbody>

            </table>

          `;
        }
      );


    area.innerHTML =
      html;


    window.print();
  }


  render();

  conectar();

</script>

</body>
</html>
