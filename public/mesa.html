<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
Mesa de Recebimento — V2
</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f3f5;
  color: #222;
}

header {
  background: #111;
  color: white;
  padding: 18px 22px;
  border-bottom: 5px solid #c7a84b;
}

header h1 {
  margin: 0;
  font-size: 24px;
}

header p {
  margin: 6px 0 0;
  color: #ddd;
}

main {
  max-width: 1200px;
  margin: 25px auto;
  padding: 0 16px;
}

.top {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  align-items: center;
  margin-bottom: 18px;
}

.acoes {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

button {
  border: 0;
  border-radius: 7px;
  padding: 11px 15px;
  font-weight: bold;
  cursor: pointer;
}

.dark {
  background: #333;
  color: white;
}

.gold {
  background: #8b6f1d;
  color: white;
}

.conexao {
  padding: 10px;
  border-radius: 7px;
  background: #f9dddd;
  color: #8a1f1f;
  font-weight: bold;
  margin-bottom: 15px;
}

.conexao.online {
  background: #ddf3e1;
  color: #17652b;
}

.painel {
  background: white;
  border-radius: 12px;
  padding: 20px;
  box-shadow:
    0 2px 10px rgba(0,0,0,.08);
}

.fila {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.item {
  border: 1px solid #ddd;
  border-left: 7px solid #c7a84b;
  border-radius: 9px;
  padding: 16px;
  background: #fffdf5;
}

.item.confirmado {
  border-left-color: #2e7d32;
  background: #f7fff8;
}

.grid {
  display: grid;
  grid-template-columns:
    repeat(3,1fr);
  gap: 10px;
  margin: 14px 0;
}

.dado {
  background: white;
  border: 1px solid #e2e2e2;
  border-radius: 7px;
  padding: 10px;
}

.label {
  display: block;
  font-size: 11px;
  color: #777;
  text-transform: uppercase;
  margin-bottom: 4px;
}

.valor {
  font-weight: bold;
  word-break: break-word;
}

.hora {
  font-size: 12px;
  color: #777;
}

.status {
  font-weight: bold;
  color: #777;
  margin: 8px 0;
}

.status.ok {
  color: #2e7d32;
}

.receber {
  width: 100%;
  background: #2e7d32;
  color: white;
  font-size: 16px;
}

.receber:disabled {
  opacity: .8;
}

.vazio {
  text-align: center;
  color: #777;
  padding: 50px;
  border: 2px dashed #ddd;
  border-radius: 8px;
}

@media(max-width:700px) {

  .top {
    flex-direction: column;
    align-items: flex-start;
  }

  .grid {
    grid-template-columns: 1fr;
  }

}

  .somente-impressao {
  display: none;
}

@media print {

  @page {
    size: A4 portrait;
    margin: 10mm;
  }

  body {
    background: white;
    color: black;
    font-family: Arial, sans-serif;
    font-size: 11px;
  }

  header {
    padding: 8px 0;
    background: white;
    color: black;
    border-bottom: 2px solid #000;
  }

  header h1 {
    font-size: 15px;
  }

  header p {
    font-size: 10px;
    margin: 2px 0 0;
  }

  main {
    margin: 8px 0;
    padding: 0;
    max-width: none;
  }

  .top,
  .conexao,
  .painel {
    display: none !important;
  }

  .somente-impressao {
    display: block;
  }

  .lista-impressao {
    width: 100%;
  }

  .grupo-impressao {
    margin-bottom: 10px;
    break-inside: avoid;
  }

  .grupo-impressao h2 {
    font-size: 13px;
    margin: 8px 0 3px;
    padding: 3px 5px;
    border-bottom: 1px solid #000;
  }

  .tabela-impressao {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }

  .tabela-impressao th,
  .tabela-impressao td {
    border-bottom: 1px solid #ccc;
    padding: 3px 5px;
    text-align: left;
    line-height: 1.2;
  }

  .tabela-impressao th {
    font-size: 9px;
    text-transform: uppercase;
  }

  .tabela-impressao td {
    font-size: 10px;
  }

  .tabela-impressao th:nth-child(1),
  .tabela-impressao td:nth-child(1) {
    width: 65%;
  }

  .tabela-impressao th:nth-child(2),
  .tabela-impressao td:nth-child(2) {
    width: 20%;
  }

  .tabela-impressao th:nth-child(3),
  .tabela-impressao td:nth-child(3) {
    width: 15%;
  }

}
  
@media print {

  .acoes,
  .conexao,
  .receber {
    display: none;
  }

  .item {
    break-inside: avoid;
  }

  .painel {
    box-shadow: none;
  }

}

</style>

</head>

<body>

<header>

<h1>
POLÍCIA PENAL DE MATO GROSSO DO SUL
</h1>

<p>
Mesa de Recebimento — Sistema de Atendimento V2
</p>

</header>

<main>

<div class="top">

<div>

<h2>
Atendimentos recebidos
</h2>

<p>
Acompanhe e confirme os atendimentos enviados pelos guichês.
</p>

</div>

<div class="acoes">

<button
  class="dark"
  onclick="ativarNotificacao()"
>
🔔 Notificações
</button>

<button
  id="somBtn"
  class="gold"
  onclick="ativarSom()"
>
🔊 Som
</button>

<button
  class="dark"
  onclick="imprimirLista()"
>
🖨️ Imprimir lista
</button>

</div>

</div>


<div
  id="conexao"
  class="conexao"
>
🔴 Desconectado
</div>


<section
  id="listaImpressao"
  class="somente-impressao lista-impressao"
>
</section>

<h3>
Fila de atendimento
</h3>

<div
  id="fila"
  class="fila"
>

<div class="vazio">
Nenhum atendimento aguardando recebimento.
</div>

</div>

</section>

</main>


<script>

let ws = null;

let lista = [];

let som = false;

let audio = null;


function esc(valor) {

  return String(
    valor == null
      ? ""
      : valor
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;");

}


function hora(valor) {

  return valor
    ? new Date(valor)
        .toLocaleString("pt-BR")
    : "";

}


function render() {

  const elemento =
    document.getElementById(
      "fila"
    );


  if (!lista.length) {

    elemento.innerHTML =
      '<div class="vazio">' +
      'Nenhum atendimento aguardando recebimento.' +
      '</div>';

    return;
  }


  elemento.innerHTML =
    lista.map(
      item => {

        const registro =
          item.record || {};


        return `

        <article
          class="item
          ${
            item.confirmado
              ? "confirmado"
              : ""
          }"
        >

        <h3>
        ${esc(
          registro.nome ||
          "Não informado"
        )}
        </h3>

        <div class="hora">

        Enviado em:
        ${esc(
          hora(
            item.sentAt
          )
        )}

        </div>


        <div class="grid">

        <div class="dado">

        <span class="label">
        Identificação
        </span>

        <span class="valor">
        ${esc(
          registro.identificacao
        )}
        </span>

        </div>


        <div class="dado">

        <span class="label">
        Pavilhão
        </span>

        <span class="valor">
        ${esc(
          registro.pavilhao
        )}
        </span>

        </div>


        <div class="dado">

        <span class="label">
        Cela
        </span>

        <span class="valor">
        ${esc(
          registro.cela
        )}
        </span>

        </div>


        <div class="dado">

        <span class="label">
        Atendimento
        </span>

        <span class="valor">
        ${esc(
          registro.atendimento
        )}
        </span>

        </div>


        <div class="dado">

        <span class="label">
        Assunto
        </span>

        <span class="valor">
        ${esc(
          registro.assunto ||
          "—"
        )}
        </span>

        </div>

        </div>


        <div
          class="status
          ${
            item.confirmado
              ? "ok"
              : ""
          }"
        >

        ${
          item.confirmado
            ? "✓ RECEBIDO ÀS " +
              esc(
                hora(
                  item.recebidoEm
                )
              )
            : "⏳ Aguardando confirmação da Mesa"
        }

        </div>


        <button
          class="receber"
          ${
            item.confirmado
              ? "disabled"
              : ""
          }
          onclick="
            confirmar(
              '${esc(item.recordId)}'
            )
          "
        >

        ${
          item.confirmado
            ? "✓ RECEBIDO"
            : "RECEBIDO"
        }

        </button>

        </article>

        `;

      }
    ).join("");

}


function confirmar(id) {

  const item =
    lista.find(
      registro =>
        registro.recordId ===
        id
    );


  if (
    !item ||
    item.confirmado ||
    !ws ||
    ws.readyState !==
    WebSocket.OPEN
  ) {

    return;
  }


  item.confirmando = true;

  render();


  ws.send(
    JSON.stringify({

      type:
        "confirm_received",

      recordId:
        id

    })
  );

}


function conectar() {

  const protocolo =
    location.protocol ===
    "https:"
      ? "wss:"
      : "ws:";


  ws =
    new WebSocket(
      protocolo +
      "//" +
      location.host
    );


  ws.onopen =
    () => {

      const conexao =
        document.getElementById(
          "conexao"
        );

      conexao.className =
        "conexao online";

      conexao.textContent =
        "🟢 Conectado ao servidor";


      ws.send(
        JSON.stringify({

          type:
            "register",

          role:
            "receiver"

        })
      );

    };


  ws.onclose =
    () => {

      const conexao =
        document.getElementById(
          "conexao"
        );

      conexao.className =
        "conexao";

      conexao.textContent =
        "🔴 Desconectado — reconectando...";


      setTimeout(
        conectar,
        3000
      );

    };


  ws.onmessage =
    event => {

      try {

        const mensagem =
          JSON.parse(
            event.data
          );


        if (
          mensagem.type ===
          "new_record"
        ) {

          if (
            !lista.some(
              item =>
                item.recordId ===
                mensagem.recordId
            )
          ) {

            lista.unshift({

              recordId:
                mensagem.recordId,

              record:
                mensagem.record ||
                {},

              sentAt:
                mensagem.sentAt,

              confirmado:
                false

            });


            render();

            tocar();

            notificar(
              mensagem
            );

          }

        }


        if (
          mensagem.type ===
          "record_received"
        ) {

          const item =
            lista.find(
              registro =>
                registro.recordId ===
                mensagem.recordId
            );


          if (item) {

            item.confirmado =
              true;

            item.confirmando =
              false;

            item.recebidoEm =
              mensagem.receivedAt;

            render();

          }

        }

      } catch (_) {}

    };

}


function ativarSom() {

  const AudioContext =
    window.AudioContext ||
    window.webkitAudioContext;


  if (!AudioContext) {
    return;
  }


  audio =
    audio ||
    new AudioContext();


  if (
    audio.state ===
    "suspended"
  ) {

    audio.resume();

  }


  som = true;


  document
    .getElementById(
      "somBtn"
    )
    .textContent =
    "🔊 Som ativado";


  tocar();

}


function tocar() {

  if (
    !som ||
    !audio
  ) {

    return;
  }


  const oscilador =
    audio.createOscillator();

  const ganho =
    audio.createGain();

  const tempo =
    audio.currentTime;


  oscilador.frequency.value =
    880;


  ganho.gain.setValueAtTime(
    0.0001,
    tempo
  );


  ganho.gain
    .exponentialRampToValueAtTime(
      0.25,
      tempo + 0.02
    );


  ganho.gain
    .exponentialRampToValueAtTime(
      0.0001,
      tempo + 0.4
    );


  oscilador.connect(
    ganho
  );

  ganho.connect(
    audio.destination
  );


  oscilador.start(tempo);

  oscilador.stop(
    tempo + 0.45
  );

}


async function ativarNotificacao() {

  if (
    "Notification"
    in window
  ) {

    const permissao =
      await Notification
        .requestPermission();


    if (
      permissao ===
      "granted"
    ) {

      new Notification(
        "Mesa de Recebimento",
        {
          body:
            "Notificações ativadas."
        }
      );

    }

  }

}


function notificar(item) {

  if (
    "Notification"
    in window &&
    Notification.permission ===
    "granted"
  ) {

    new Notification(
      "Novo atendimento",
      {
        body:
          (
            item.record &&
            item.record.nome
          ) ||
          "Atendimento" +
          " aguarda recebimento."
      }
    );

  }

}


function imprimirLista() {

  const area =
    document.getElementById(
      "listaImpressao"
    );

  const grupos = {};

  lista.forEach(item => {

    const registro =
      item.record || {};

    const atendimento =
      registro.atendimento ||
      "Outros";

    if (!grupos[atendimento]) {
      grupos[atendimento] = [];
    }

    grupos[atendimento].push(
      registro
    );

  });


  const atendimentos =
    Object.keys(grupos)
      .sort((a, b) =>
        a.localeCompare(
          b,
          "pt-BR"
        )
      );


  if (!atendimentos.length) {

    area.innerHTML = `
      <p>
        Nenhum atendimento para imprimir.
      </p>
    `;

  } else {

    area.innerHTML =
      atendimentos
        .map(atendimento => {

          const registros =
            grupos[atendimento];

          const linhas =
            registros
              .map(registro => {

                return `
                  <tr>

                    <td>
                      ${esc(
                        registro.nome ||
                        "Não informado"
                      )}
                    </td>

                    <td>
                      ${esc(
                        registro.pavilhao ||
                        ""
                      )}
                    </td>

                    <td>
                      ${esc(
                        registro.cela ||
                        ""
                      )}
                    </td>

                  </tr>
                `;

              })
              .join("");


          return `
            <section
              class="grupo-impressao"
            >

              <h2>
                ${esc(atendimento)}
              </h2>

              <table
                class="tabela-impressao"
              >

                <thead>

                  <tr>
                    <th>Nome</th>
                    <th>Pavilhão</th>
                    <th>Cela</th>
                  </tr>

                </thead>

                <tbody>
                  ${linhas}
                </tbody>

              </table>

            </section>
          `;

        })
        .join("");

  }


  window.print();

}


render();

conectar();

</script>

</body>

</html>
