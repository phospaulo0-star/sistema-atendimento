<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guichê V2 - Sistema de Atendimento</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f2f2f2;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header .cpaig {
      margin-top: 6px;
      color: #f2c94c;
      font-size: 18px;
      font-weight: bold;
    }

    header .subtitulo {
      margin-top: 8px;
      font-size: 16px;
    }

    main {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.10);
    }

    .card h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .campo {
      display: flex;
      flex-direction: column;
    }

    .campo.full {
      grid-column: 1 / -1;
    }

    label {
      font-weight: bold;
      margin-bottom: 6px;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #bbb;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .botoes {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .btn-adicionar {
      background: #333;
      color: white;
    }

    .btn-enviar {
      background: #16803c;
      color: white;
    }

    .btn-enviar:hover {
      background: #10652f;
    }

    .status {
      padding: 12px;
      border-radius: 8px;
      background: #eee;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .status.online {
      background: #d9f5df;
      color: #176b2e;
    }

    .status.offline {
      background: #ffe0e0;
      color: #9b1c1c;
    }

    .fila-item,
    .historico-item {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 10px;
      background: #fafafa;
    }

    .historico-topo {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .nome {
      font-weight: bold;
      font-size: 18px;
    }

    .badge {
      display: inline-block;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      background: #ddd;
    }

    .badge.pendente {
      background: #ffe4a3;
      color: #765300;
    }

    .badge.recebido {
      background: #ccefd4;
      color: #176b2e;
    }

    .controles-historico {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .controles-historico label {
      margin: 0;
    }

    .controles-historico select {
      max-width: 220px;
    }

    .vazio {
      color: #777;
      text-align: center;
      padding: 20px;
    }

    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .campo.full {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>POLÍCIA PENAL DE MATO GROSSO DO SUL</h1>
  <div class="cpaig">CPAIG</div>
  <div class="subtitulo">Sistema de Atendimento — Guichê V2</div>
</header>

<main>

  <div id="status" class="status offline">
    ● Desconectado
  </div>

  <section class="card">

    <h2>Novo atendimento</h2>

    <div class="grid">

      <div class="campo">
        <label for="nome">Nome do interno</label>
        <input
          type="text"
          id="nome"
          autocomplete="off"
          placeholder="Digite o nome"
        >
      </div>

      <div class="campo">
        <label for="rgi">RGI</label>
        <input
          type="text"
          id="rgi"
          autocomplete="off"
          placeholder="Digite o RGI"
        >
      </div>

      <div class="campo">
        <label for="pavilhao">Pavilhão</label>
        <select id="pavilhao">
          <option value="">Selecione</option>
          <option value="A">A</option>
          <option value="B">B</option>
          <option value="C">C</option>
          <option value="D">D</option>
          <option value="DISCIPLINAR">DISCIPLINAR</option>
          <option value="DISCIPLINAR RISCO">DISCIPLINAR RISCO</option>
          <option value="CP">CP</option>
          <option value="VIRTUAL">VIRTUAL</option>
        </select>
      </div>

      <div class="campo">
        <label for="cela">Cela</label>
        <select id="cela">
          <option value="">Selecione</option>
        </select>
      </div>

      <div class="campo">
        <label for="atendimento">Atendimento</label>
        <select id="atendimento">
          <option value="">Selecione</option>
          <option value="Jurídico">Jurídico</option>
          <option value="Psicossocial">Psicossocial</option>
          <option value="Médico">Médico</option>
          <option value="Odontologia">Odontologia</option>
          <option value="Trabalho">Trabalho</option>
          <option value="Chefia">Chefia</option>
          <option value="Chefe de equipe">Chefe de equipe</option>
          <option value="Portaria II">Portaria II</option>
          <option value="Identificação">Identificação</option>
          <option value="Limpeza">Limpeza</option>
          <option value="Advogado(a)">Advogado(a)</option>
          <option value="Visita Assistida">Visita Assistida</option>
          <option value="Autorização de Saída">Autorização de Saída</option>
          <option value="Audiência">Audiência</option>
          <option value="Escolta">Escolta</option>
          <option value="Videoconferência">Videoconferência</option>
          <option value="Defensoria">Defensoria</option>
          <option value="Administração">Administração</option>
          <option value="Outros">Outros</option>
        </select>
      </div>

      <div class="campo full">
        <label for="assunto">Assunto</label>
        <input
          type="text"
          id="assunto"
          autocomplete="off"
          placeholder="Digite o assunto, se necessário"
        >
      </div>

    </div>

    <div class="botoes">
      <button
        class="btn-adicionar"
        onclick="adicionar()"
      >
        ADICIONAR À FILA
      </button>

      <button
        class="btn-enviar"
        onclick="enviar()"
      >
        ENVIAR PARA A MESA
      </button>
    </div>

  </section>

  <section class="card">

    <h2>Fila atual</h2>

    <div id="fila"></div>

  </section>

  <section class="card">

    <h2>Histórico de atendimentos enviados</h2>

    <div class="controles-historico">

      <label for="ordemHistorico">
        Visualizar:
      </label>

      <select
        id="ordemHistorico"
        onchange="renderHistorico()"
      >
        <option value="envio">
          Ordem de envio
        </option>

        <option value="atendimento">
          Por atendimento
        </option>
      </select>

    </div>

    <div id="historico"></div>

  </section>

</main>

<script>

  const WS_URL =
    (location.protocol === "https:" ? "wss://" : "ws://") +
    location.host;

  let ws = null;

  let fila = [];

  let historico =
    JSON.parse(
      localStorage.getItem(
        "atendimentoV2Historico"
      ) || "[]"
    );

  let outbox =
    JSON.parse(
      localStorage.getItem(
        "atendimentoV2Outbox"
      ) || "[]"
    );

  const nomeEl =
    document.getElementById("nome");

  const rgiEl =
    document.getElementById("rgi");

  const pavilhaoEl =
    document.getElementById("pavilhao");

  const celaEl =
    document.getElementById("cela");

  const atendimentoEl =
    document.getElementById("atendimento");

  const assuntoEl =
    document.getElementById("assunto");

  const statusEl =
    document.getElementById("status");

  const filaEl =
    document.getElementById("fila");

  const historicoEl =
    document.getElementById("historico");


  // Cria as opções de cela 01 até 120
  for (let i = 1; i <= 120; i++) {

    const numero =
      String(i).padStart(2, "0");

    const option =
      document.createElement("option");

    option.value = numero;
    option.textContent = numero;

    celaEl.appendChild(option);
  }


  function salvarHistorico() {

    localStorage.setItem(
      "atendimentoV2Historico",
      JSON.stringify(historico)
    );
  }


  function salvarOutbox() {

    localStorage.setItem(
      "atendimentoV2Outbox",
      JSON.stringify(outbox)
    );
  }


  function gerarId() {

    if (
      window.crypto &&
      crypto.randomUUID
    ) {
      return crypto.randomUUID();
    }

    return (
      Date.now().toString(36) +
      Math.random()
        .toString(36)
        .substring(2)
    );
  }


  function atualizarStatus(online) {

    if (online) {

      statusEl.textContent =
        "● Conectado à MESA";

      statusEl.className =
        "status online";

    } else {

      statusEl.textContent =
        "● MESA desconectada — atendimentos enviados ficarão pendentes";

      statusEl.className =
        "status offline";
    }
  }


  function conectar() {

    try {

      ws = new WebSocket(WS_URL);

      ws.onopen = () => {

        atualizarStatus(true);

        ws.send(
          JSON.stringify({
            type: "register",
            role: "sender"
          })
        );

        enviarPendentes();
      };


      ws.onmessage = (event) => {

        let mensagem;

        try {

          mensagem =
            JSON.parse(event.data);

        } catch {

          return;
        }


        if (
          mensagem.type ===
          "record_received"
        ) {

          const item =
            historico.find(
              x =>
                x.recordId ===
                mensagem.recordId
            );

          if (item) {

            item.recebidoEm =
              mensagem.receivedAt;

            salvarHistorico();
          }


          outbox =
            outbox.filter(
              x =>
                x.recordId !==
                mensagem.recordId
            );

          salvarOutbox();

          renderHistorico();
        }

      };


      ws.onclose = () => {

        atualizarStatus(false);

        setTimeout(
          conectar,
          3000
        );
      };


      ws.onerror = () => {

        atualizarStatus(false);
      };

    } catch {

      atualizarStatus(false);

      setTimeout(
        conectar,
        3000
      );
    }
  }


  function enviarPendentes() {

    if (
      !ws ||
      ws.readyState !==
        WebSocket.OPEN
    ) {
      return;
    }


    for (
      const item of outbox
    ) {

      ws.send(
        JSON.stringify({
          type: "send_record",
          recordId: item.recordId,
          record: item.record
        })
      );
    }
  }


  function adicionar() {

    const nome =
      nomeEl.value.trim();

    const rgi =
      rgiEl.value.trim();

    const pavilhao =
      pavilhaoEl.value;

    const cela =
      celaEl.value;

    const atendimento =
      atendimentoEl.value;

    const assunto =
      assuntoEl.value.trim();


    if (
      !nome ||
      !rgi ||
      !pavilhao ||
      !cela ||
      !atendimento
    ) {

      alert(
        "Preencha Nome, RGI, Pavilhão, Cela e Atendimento."
      );

      return;
    }


    fila.push({

      id: gerarId(),

      nome,

      rgi,

      pavilhao,

      cela,

      atendimento,

      assunto

    });


    renderFila();

    limparCampos();
  }


  function renderFila() {

    if (!fila.length) {

      filaEl.innerHTML =
        '<div class="vazio">Nenhum atendimento na fila.</div>';

      return;
    }


    filaEl.innerHTML =
      fila.map(
        item => `

          <div class="fila-item">

            <div class="nome">
              ${escapeHtml(item.nome)}
            </div>

            <div>
              RGI: ${escapeHtml(item.rgi)}
            </div>

            <div>
              Pavilhão:
              ${escapeHtml(item.pavilhao)}
              —
              Cela:
              ${escapeHtml(item.cela)}
            </div>

            <div>
              Atendimento:
              ${escapeHtml(item.atendimento)}
            </div>

            ${
              item.assunto
                ? `
                  <div>
                    Assunto:
                    ${escapeHtml(item.assunto)}
                  </div>
                `
                : ""
            }

          </div>
        `
      )
      .join("");
  }


  function enviar() {

    if (!fila.length) {

      alert(
        "Não há atendimento na fila."
      );

      return;
    }


    const agora =
      new Date().toISOString();


    const novos =
      fila.map(item => {

        const record = {

          nome: item.nome,

          rgi: item.rgi,

          pavilhao:
            item.pavilhao,

          cela:
            item.cela,

          atendimento:
            item.atendimento,

          assunto:
            item.assunto

        };


        const registro = {

          recordId:
            item.id,

          ...record,

          enviadoEm:
            agora,

          recebidoEm:
            null

        };


        historico.push(
          registro
        );


        outbox.push({

          recordId:
            item.id,

          record

        });


        return item;
      });


    salvarHistorico();

    salvarOutbox();


    fila = [];

    renderFila();

    renderHistorico();


    enviarPendentes();


    if (
      ws &&
      ws.readyState ===
        WebSocket.OPEN
    ) {

      alert(
        novos.length === 1
          ? "Atendimento enviado para a MESA."
          : "Atendimentos enviados para a MESA."
      );

    } else {

      alert(
        "A MESA está desconectada. O atendimento foi salvo e será enviado automaticamente quando a conexão voltar."
      );
    }

  }


  function limparCampos() {

    nomeEl.value = "";

    rgiEl.value = "";

    pavilhaoEl.value = "";

    celaEl.value = "";

    atendimentoEl.value = "";

    assuntoEl.value = "";

    nomeEl.focus();
  }


  function renderHistorico() {

    if (!historico.length) {

      historicoEl.innerHTML =
        '<div class="vazio">Nenhum atendimento enviado.</div>';

      return;
    }


    const ordem =
      document.getElementById(
        "ordemHistorico"
      ).value;


    const lista =
      historico
        .slice()
        .sort(
          (a, b) => {

            if (
              ordem ===
              "atendimento"
            ) {

              const cmp =
                String(
                  a.atendimento
                ).localeCompare(
                  String(
                    b.atendimento
                  ),
                  "pt-BR"
                );

              if (cmp !== 0) {
                return cmp;
              }
            }

            return (
              new Date(
                b.enviadoEm
              ) -
              new Date(
                a.enviadoEm
              )
            );
          }
        );


    historicoEl.innerHTML =
      lista
        .map(item => {

          const pendente =
            !item.recebidoEm;

          const enviado =
            formatarData(
              item.enviadoEm
            );

          const recebido =
            item.recebidoEm
              ? formatarData(
                  item.recebidoEm
                )
              : "Aguardando MESA";


          return `

            <div class="historico-item">

              <div class="historico-topo">

                <div class="nome">
                  ${escapeHtml(item.nome)}
                </div>

                <span
                  class="badge ${
                    pendente
                      ? "pendente"
                      : "recebido"
                  }"
                >
                  ${
                    pendente
                      ? "PENDENTE"
                      : "RECEBIDO"
                  }
                </span>

              </div>

              <div>
                RGI:
                ${escapeHtml(item.rgi)}
              </div>

              <div>
                Pavilhão:
                ${escapeHtml(item.pavilhao)}
                —
                Cela:
                ${escapeHtml(item.cela)}
              </div>

              <div>
                Atendimento:
                <strong>
                  ${escapeHtml(item.atendimento)}
                </strong>
              </div>

              ${
                item.assunto
                  ? `
                    <div>
                      Assunto:
                      ${escapeHtml(item.assunto)}
                    </div>
                  `
                  : ""
              }

              <div>
                Enviado:
                ${enviado}
              </div>

              <div>
                Recebido:
                ${recebido}
              </div>

            </div>
          `;
        })
        .join("");
  }


  function formatarData(data) {

    if (!data) {
      return "-";
    }

    return new Date(data)
      .toLocaleString(
        "pt-BR"
      );
  }


  function escapeHtml(valor) {

    return String(valor ?? "")
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );
  }


  renderFila();

  renderHistorico();

  conectar();

</script>

</body>
</html>
